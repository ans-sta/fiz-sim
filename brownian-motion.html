<!DOCTYPE html>
<html lang="lv" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brauna kustība — FIZ-SIM</title>
<script>
  // Tēma pirms pirmā zīmējuma, lai nemirgo; tā pati loģika kā sim-core.js createTheme().
  try {
    var saved = localStorage.getItem('fiz-sim-theme');
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sim-common.css">
<script type="module" src="assets/brownian/main.js"></script>
</head>
<body class="layout-hud">
<div class="frame">
  <header>
    <a class="back" href="index.html" data-i18n="page.back">← SARAKSTS</a>
    <h1><span data-i18n="page.heading">BRAUNA KUSTĪBA</span> <span class="sheet-no">M-01</span></h1>
    <div class="head-tools" id="headTools"></div>
  </header>
  <div class="m01-bar" id="bar">
    <div class="m01-group">
      <span class="m01-label" id="tLabel">TEMPERATŪRA</span>
      <div class="m01-row">
        <button class="q-step" id="tMinus" type="button">−</button>
        <input class="dim-range" id="tRange" type="range">
        <button class="q-step" id="tPlus" type="button">+</button>
        <span class="m01-val" id="tVal">300 K</span>
      </div>
    </div>
    <div class="m01-group">
      <span class="m01-label" id="showLabel">RĀDĪT</span>
      <div class="m01-row">
        <button class="btn" id="trailBtn" type="button" aria-pressed="false">TRAJEKTORIJA</button>
        <button class="btn" id="molBtn" type="button" aria-pressed="false">MOLEKULAS</button>
        <button class="btn" id="lensBtn" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4.5 4.5"/></svg><span id="lensText">LUPA</span></button>
      </div>
    </div>
    <div class="m01-group m01-end">
      <span class="m01-label" id="runLabel">KUSTĪBA</span>
      <div class="m01-row">
        <button class="btn pause" id="pauseBtn" type="button">⏸</button>
        <button class="btn" id="resetBtn" type="button">↺ NO CENTRA</button>
      </div>
    </div>
  </div>
  <div class="work">
    <div class="drawing" id="drawing">
      <p class="boot-msg" id="bootMsg">Lapa neielādējās. Atver to caur tīmekļa serveri (piem. ans-sta.github.io/fiz-sim), nevis kā failu no datora. · The page did not load. Open it through a web server, not as a local file.</p>
      <canvas id="scene" role="img" data-i18n-aria="scene.aria"></canvas>
      <div class="notices" id="notices" role="status" aria-live="polite"></div>
      <div class="title-small" id="titleSmall" hidden></div>
      <div id="gear"></div>
    </div>
  </div>
</div>
</body>
</html>
