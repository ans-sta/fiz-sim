<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Electric Field Visualizer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Āda (neons / rasējums) un rasējuma tēma pirms pirmā zīmējuma, lai nemirgo; tās pašas atslēgas kā jaunajās lapās (tēma)
      (function () {
        try {
          var s = localStorage.getItem("fiz-sim-skin") === "draw" ? "draw" : "neon";
          var t = localStorage.getItem("fiz-sim-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.skin = s;
          document.documentElement.dataset.theme = s === "draw" ? t : "dark";
        } catch (e) {}
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #060a14;
        --panel: #0c1220;
        --panel-border: #1a2540;
        --accent: #00ccff;
        --accent-dim: #00ccff44;
        --positive: #ff3355;
        --positive-glow: #ff335566;
        --negative: #3388ff;
        --negative-glow: #3388ff66;
        --test-charge: #00ff88;
        --text: #c8d6e8;
        --text-dim: #5a6d88;
        --text-muted: #354050;
        --font-display: "Orbitron", monospace;
        --font-body: "Exo 2", sans-serif;
        --radius: 6px;
        --header-bg: linear-gradient(180deg, #0d1525 0%, var(--bg) 100%);
      }
      /* ── Rasējuma āda: tie paši marķieri kā assets/sim-common.css (grafīts / papīrs), bez spīdumiem un noapaļojumiem ── */
      :root[data-skin="draw"] {
        --sheet: #15171b;
        --ink: #e8e6e1;
        --ink-dim: #9a9891;
        --hairline: #3a3d42;
        --field: #0c0e11;
        --accent: #ff7a29;
        --accent-dim: transparent;
        --bg: var(--sheet);
        --panel: var(--sheet);
        --panel-border: var(--hairline);
        --text: var(--ink);
        --text-dim: var(--ink-dim);
        --text-muted: var(--ink-dim);
        --positive: #ff3355;
        --positive-glow: transparent;
        --negative: #3388ff;
        --negative-glow: transparent;
        --test-charge: #00ff88;
        --font-display: "IBM Plex Mono", monospace;
        --font-body: "IBM Plex Mono", monospace;
        --radius: 0;
        --header-bg: var(--sheet);
      }
      :root[data-skin="draw"][data-theme="light"] {
        --sheet: #f2efe9;
        --ink: #26261f;
        --ink-dim: #7a776d;
        --hairline: #c9c4b8;
        --field: #faf8f3;
        --accent: #c75612;
        --positive: #c8203f;
        --negative: #1f5fc4;
        --test-charge: #118a4f;
      }

      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        height: 100vh;
        height: 100dvh; /* telefonā pārlūka joslas nenogriež lauka apakšu */
        width: 100%;
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ═══════════════════════════════════════════
         HEADER
         ═══════════════════════════════════════════ */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 12px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--panel-border);
        flex-shrink: 0;
        min-height: 42px;
      }
      .back-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
      }
      .back-btn:hover { color: var(--accent); }
      header h1 {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--accent), #66eeff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .header-spacer { flex: 1; }
      .sheet-no { display: none; }
      .skin-switch, .lang-switch { font-family: var(--font-display); font-size: 11px; letter-spacing: 1px; display: flex; align-items: center; }
      .skin-switch button, .theme-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 6px; font-family: inherit; font-size: inherit; letter-spacing: inherit; }
      .skin-switch button:hover, .theme-btn:hover { color: var(--text-dim); background: none; border: none; }
      .skin-switch button[aria-pressed="true"] { color: var(--accent); }
      .skin-switch .lang-sep { color: var(--text-muted); }
      .theme-btn, .skin-btn { display: none; font-size: 15px; line-height: 1; }
      .link-btn {
        background: none;
        border: 1px solid var(--accent-dim);
        color: var(--text-dim);
        padding: 4px 10px;
        border-radius: var(--radius);
        font-size: 11px;
        cursor: pointer;
        font-family: var(--font-display);
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .link-btn:hover { border-color: var(--accent); color: var(--accent); background: none; }
      .lang-switch button {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 6px;
        transition: color 0.2s;
        font-family: inherit;
        font-size: inherit;
      }
      .lang-switch button:hover { color: var(--text-dim); background: none; border: none; }
      .lang-switch button.active { color: var(--accent); }
      .lang-switch .lang-sep { color: var(--text-muted); }

      /* ═══════════════════════════════════════════
         TOOLBAR — viena josla visām ierīcēm, grupas pārlūst rindās
         ═══════════════════════════════════════════ */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        padding: 4px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
        flex-shrink: 0;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 4px 14px;
        border-right: 1px solid var(--panel-border);
      }
      .group-end { border-right: none; margin-left: auto; }
      .group-label {
        font-family: var(--font-display);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent);
        white-space: nowrap;
      }
      .group-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-height: 34px;
      }
      .charge-count {
        font-size: 13px;
        color: var(--text-dim);
        white-space: nowrap;
        padding-left: 4px;
      }
      .charge-count span { color: var(--accent); }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .slider-row[hidden] { display: none; }
      .slider-row .slider-sym { font-style: italic; color: var(--test-charge); font-size: 14px; }
      .slider-row input[type="range"] {
        width: 110px;
        accent-color: var(--test-charge);
        height: 6px;
      }
      .slider-row .slider-val {
        font-family: var(--font-display);
        font-size: 13px;
        min-width: 28px;
        text-align: right;
        color: var(--test-charge);
      }
      .hint {
        flex-basis: 100%;
        font-size: 12px;
        color: var(--text-dim);
        padding: 2px 14px 4px;
      }

      /* Pogas */
      button {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 7px 12px;
        font-family: var(--font-body);
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        white-space: nowrap;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
      }
      button.active-pos {
        background: var(--positive-glow);
        border-color: var(--positive);
        color: #fff;
      }
      button.active-neg {
        background: var(--negative-glow);
        border-color: var(--negative);
        color: #fff;
      }
      button.primary {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover { background: rgba(0, 204, 255, 0.3); }
      button.danger {
        border-color: #ff4466;
        color: #ff6688;
      }
      button.danger:hover {
        background: rgba(255, 68, 102, 0.2);
        border-color: #ff6688;
      }
      button.small { font-size: 12px; padding: 4px 8px; }
      button.toggle { color: var(--text-dim); }
      button.toggle[aria-pressed="true"] {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
      }

      /* ═══════════════════════════════════════════
         LAUKS — viss, kas paliek zem joslas, no malas līdz malai
         ═══════════════════════════════════════════ */
      #canvas-wrap {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
      }

      /* ═══════════════════════════════════════════
         Telefons — tās pašas pogas ar vārdiem, grupas pa rindām
         ═══════════════════════════════════════════ */
      @media (max-width: 700px) {
        header { padding: 4px 8px; gap: 8px; min-height: 38px; }
        header h1 { font-size: 13px; letter-spacing: 1px; }
        .link-btn { display: none; }
        /* telefonā āda — viena ikona ◧ (pārslēdz), lapas numurs paslēpts; rasējuma pogas bez platā atstatuma */
        .skin-switch button[data-skin], .skin-switch .lang-sep { display: none; }
        .skin-btn { display: inline-block; }

        .toolbar { padding: 2px 4px; }
        .group { padding: 3px 6px; border-right: none; }
        .group-label { display: none; }
        .group-row { min-height: 30px; gap: 4px; }
        .group-charges { order: 0; }
        .group-end { order: 1; }
        .group-test { order: 2; flex-basis: 100%; }
        .group-display { order: 3; flex-basis: 100%; }
        button { padding: 6px 8px; font-size: 13px; }
        .charge-count { padding-left: 0; }
        .slider-row input[type="range"] { width: 90px; }
        .hint { display: none; }
      }
      /* Zems ekrāns (telefons guļus): josla bez grupu virsrakstiem un ar mazākām pogām, lai laukumam paliek vieta */
      @media (max-height: 500px) {
        .hint { display: none; }
        header { min-height: 34px; padding: 2px 8px; }
        header h1 { font-size: 12px; letter-spacing: 1px; }
        .toolbar { padding: 2px 6px; }
        .group { padding: 2px 8px; }
        .group-label { display: none; }
        .group-row { min-height: 28px; gap: 4px; }
        button { padding: 4px 8px; font-size: 12px; }
      }

      /* ═══════════════════════════════════════════
         RASĒJUMA ĀDA — komponentes: galvene kā rasējuma lapās, pogas tintes inversijā, slīdņi kā izmēru līnijas
         ═══════════════════════════════════════════ */
      [data-skin="draw"] body { font-size: 13px; }
      [data-skin="draw"] header { padding: 0; gap: 0; min-height: 0; align-items: stretch; }
      [data-skin="draw"] .back-btn { font-size: 11px; letter-spacing: 0.08em; padding: 0 16px; border-right: 1px solid var(--hairline); color: var(--ink-dim); display: flex; align-items: center; }
      [data-skin="draw"] .back-btn:hover { background: var(--ink); color: var(--sheet); }
      [data-skin="draw"] header h1 { background: none; -webkit-text-fill-color: currentColor; color: var(--ink); font-size: 14px; font-weight: 600; letter-spacing: 0.14em; padding: 10px 16px; }
      [data-skin="draw"] .bolt { display: none; } /* rasējuma lapās zibens nav */
      [data-skin="draw"] .sheet-no { display: block; align-self: center; color: var(--ink-dim); font-family: var(--font-display); font-size: 14px; letter-spacing: 0.14em; padding-right: 16px; }
      [data-skin="draw"] .link-btn { border: none; border-left: 1px solid var(--hairline); border-radius: 0; padding: 0 12px; letter-spacing: 0.08em; color: var(--ink-dim); }
      [data-skin="draw"] .link-btn:hover { background: var(--ink); color: var(--sheet); }
      [data-skin="draw"] .skin-switch, [data-skin="draw"] .lang-switch { border-left: 1px solid var(--hairline); padding: 0 6px; letter-spacing: 0.04em; }
      [data-skin="draw"] .theme-btn { display: inline-block; }
      [data-skin="draw"] .toolbar { padding: 0 6px; }
      [data-skin="draw"] .group { padding: 7px 14px 8px; }
      [data-skin="draw"] .group-label { font-size: 9.5px; letter-spacing: 0.14em; color: var(--ink-dim); font-weight: 400; }
      [data-skin="draw"] button { background: none; border: 1px solid var(--hairline); font-size: 11px; letter-spacing: 0.1em; padding: 7px 10px; transition: none; }
      [data-skin="draw"] button:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
      [data-skin="draw"] button.toggle[aria-pressed="true"],
      [data-skin="draw"] button.active-pos,
      [data-skin="draw"] button.active-neg { background: none; border-color: var(--accent); color: var(--accent); }
      [data-skin="draw"] button.active-pos { border-color: var(--positive); color: var(--positive); }
      [data-skin="draw"] button.active-neg { border-color: var(--negative); color: var(--negative); }
      [data-skin="draw"] button.primary { background: none; border-color: var(--ink); color: var(--ink); font-weight: 600; }
      [data-skin="draw"] button.danger { border-color: var(--hairline); color: var(--ink-dim); }
      [data-skin="draw"] button.danger:hover, [data-skin="draw"] button.primary:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
      [data-skin="draw"] .charge-count { font-size: 11px; letter-spacing: 0.06em; }
      [data-skin="draw"] .charge-count span { color: var(--ink); font-weight: 500; }
      [data-skin="draw"] .slider-row .slider-sym { font-style: italic; color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
      [data-skin="draw"] .slider-row .slider-val { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
      [data-skin="draw"] input[type="range"] { -webkit-appearance: none; appearance: none; height: 26px; margin: 0; background:
        linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat,
        linear-gradient(var(--ink), var(--ink)) left center / 1px 9px no-repeat,
        linear-gradient(var(--ink), var(--ink)) right center / 1px 9px no-repeat; cursor: pointer; }
      [data-skin="draw"] input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; background: var(--sheet); border: 1px solid var(--ink); transform: rotate(45deg); }
      [data-skin="draw"] input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; background: var(--sheet); border: 1px solid var(--ink); border-radius: 0; transform: rotate(45deg); }
      [data-skin="draw"] input[type="range"]:active::-webkit-slider-thumb { background: var(--accent); border-color: var(--accent); }
      [data-skin="draw"] .hint { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 12px; color: var(--ink-dim); }
      [data-skin="draw"] canvas { cursor: crosshair; }
      /* rasējuma āda telefonā — pēc komponentēm, lai pārspēj to atstarpes */
      @media (max-width: 700px) {
        [data-skin="draw"] .sheet-no { display: none; }
        [data-skin="draw"] header h1 { font-size: 12px; letter-spacing: 0.08em; padding: 8px 8px; }
        [data-skin="draw"] .back-btn { padding: 0 10px; }
        [data-skin="draw"] button { letter-spacing: 0.04em; padding: 6px 8px; }
        [data-skin="draw"] .group { padding: 3px 6px; }
      }
      @media (max-height: 500px) {
        [data-skin="draw"] button { letter-spacing: 0.04em; padding: 4px 8px; }
        [data-skin="draw"] .group { padding: 2px 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <button class="back-btn" onclick="location.href='index.html'" data-i18n-title="back" title="Back">←</button>
      <h1><span class="bolt">⚡ </span><span data-i18n="heading">ELECTRIC FIELD</span></h1>
      <span class="header-spacer"></span>
      <span class="sheet-no">E-01</span>
      <button class="link-btn" onclick="location.href='newtons-cannon.html'" data-i18n-title="tryCannon" title="Try Newton’s Cannon simulation">→ CANNON</button>
      <div class="skin-switch" id="skinSwitch">
        <button data-skin="neon" data-i18n="skinNeon">NEON</button>
        <span class="lang-sep">|</span>
        <button data-skin="draw" data-i18n="skinDraw">DRAWING</button>
        <button class="skin-btn" id="skinBtn" data-i18n-title="titleSkin" title="Neon / drawing">◧</button>
        <button class="theme-btn" id="themeBtn" data-i18n-title="titleTheme" title="Light / dark">◐</button>
      </div>
      <div class="lang-switch">
        <button data-lang="lv">LV</button>
        <span class="lang-sep">|</span>
        <button data-lang="en">EN</button>
      </div>
    </header>

    <!-- Viena vadības josla: datorā vienā rindā, šaurāk — grupas pārlūst, telefonā pa rindām -->
    <div class="toolbar" id="toolbar">
      <div class="group group-charges">
        <span class="group-label" data-i18n="fieldCharges">Field Charges</span>
        <div class="group-row" id="chargeBtns">
          <button class="active-pos" data-charge="+1" data-i18n="positive">⊕ Positive</button>
          <button data-charge="-1" data-i18n="negative">⊖ Negative</button>
          <span class="charge-count"><span data-i18n="chargesPlaced">Charges:</span> <span id="chargeCount">0</span></span>
        </div>
      </div>

      <div class="group group-test">
        <span class="group-label" data-i18n="testCharge">Test Charge</span>
        <div class="group-row">
          <button class="primary" id="btnAddTest" data-i18n="addTestCharge">+ Add Test Charge</button>
          <div class="slider-row" id="testChargeControls" hidden>
            <span class="slider-sym">q</span>
            <input type="range" id="chargeSlider" min="-10" max="10" value="1" data-i18n-aria="testValueTitle" aria-label="Test charge value" />
            <span class="slider-val" id="chargeVal">+1</span>
            <button class="danger small" id="btnRemoveTest" data-i18n="removeTestCharge">✕ Remove</button>
          </div>
        </div>
      </div>

      <div class="group group-display">
        <span class="group-label" data-i18n="display">Display</span>
        <div class="group-row" id="displayBtns">
          <button class="toggle" data-show="field" aria-pressed="true" data-i18n="fieldVectors">Field Vectors</button>
          <button class="toggle" data-show="lines" aria-pressed="false" data-i18n="fieldLines">Field Lines</button>
          <button class="toggle" data-show="equip" aria-pressed="false" data-i18n="equipotential">Equipotential</button>
          <button class="toggle" data-show="force" aria-pressed="true" data-i18n="forceArrow">Force Arrow</button>
        </div>
      </div>

      <div class="group group-end">
        <span class="group-label">&nbsp;</span>
        <div class="group-row"><button class="danger" id="btnClear" data-i18n="clearAll">✕ Clear All</button></div>
      </div>

      <p class="hint" data-i18n="hint">Click on the field to place a charge, drag to move it, right-click (or long-press) to remove it.</p>
    </div>

    <div id="canvas-wrap">
      <canvas id="fieldCanvas"></canvas>
    </div>

    <script>
      // ═══════════════════════════════════════════
      //  TRANSLATIONS
      // ═══════════════════════════════════════════
      const TRANSLATIONS = {
        en: {
          title: "Electric Field Visualizer",
          heading: "ELECTRIC FIELD",
          fieldCharges: "Field Charges",
          testCharge: "Test Charge",
          addTestCharge: "+ Add Test Charge",
          removeTestCharge: "✕ Remove",
          display: "Display",
          positive: "⊕ Positive",
          negative: "⊖ Negative",
          chargesPlaced: "Charges:",
          fieldVectors: "Field Vectors",
          fieldLines: "Field Lines",
          equipotential: "Equipotential",
          forceArrow: "Force Arrow",
          clearAll: "✕ Clear",
          back: "Back",
          tryCannon: "Try Newton’s Cannon simulation",
          testValueTitle: "Test charge value",
          skinNeon: "NEON",
          skinDraw: "DRAWING",
          titleSkin: "Neon / drawing",
          titleTheme: "Light / dark (drawing skin)",
          hint: "Click on the field to place a charge, drag to move it, right-click (or long-press) to remove it. Keys: F — field vectors, C — clear.",
        },
        lv: {
          title: "Elektriskā lauka vizualizētājs",
          heading: "ELEKTRISKAIS LAUKS",
          fieldCharges: "Lauka lādiņi",
          testCharge: "Testa lādiņš",
          addTestCharge: "+ Pievienot testa lādiņu",
          removeTestCharge: "✕ Noņemt",
          display: "Rādīt",
          positive: "⊕ Pozitīvs",
          negative: "⊖ Negatīvs",
          chargesPlaced: "Lādiņi:",
          fieldVectors: "Lauka vektori",
          fieldLines: "Lauka līnijas",
          equipotential: "Ekvipotenciāles",
          forceArrow: "Spēka vektors",
          clearAll: "✕ Notīrīt",
          back: "Atpakaļ",
          tryCannon: "Izmēģini Ņūtona lielgabala simulāciju",
          testValueTitle: "Testa lādiņa vērtība",
          skinNeon: "NEONS",
          skinDraw: "RASĒJUMS",
          titleSkin: "Neons / rasējums",
          titleTheme: "Gaišs / tumšs (rasējuma āda)",
          hint: "Klikšķis uz lauka liek lādiņu, vilkšana to pārvieto, labais klikšķis (vai ilgs pieskāriens) noņem. Taustiņi: F — lauka vektori, C — notīrīt.",
        },
      };

      // ═══════════════════════════════════════════
      //  LANGUAGE SWITCH
      // ═══════════════════════════════════════════
      function getDefaultLang() {
        const saved = localStorage.getItem("physics-sims-lang");
        if (saved) return saved;
        const browserLang = navigator.language.toLowerCase();
        return browserLang.startsWith("lv") ? "lv" : "en";
      }

      let currentLang = getDefaultLang();

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("physics-sims-lang", lang);

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.dataset.i18n;
          if (TRANSLATIONS[lang][key]) {
            el.textContent = TRANSLATIONS[lang][key];
          }
        });

        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          const key = el.dataset.i18nTitle;
          if (TRANSLATIONS[lang][key]) {
            el.title = TRANSLATIONS[lang][key];
          }
        });
        document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
          const key = el.dataset.i18nAria;
          if (TRANSLATIONS[lang][key]) {
            el.setAttribute("aria-label", TRANSLATIONS[lang][key]);
          }
        });

        if (TRANSLATIONS[lang].title) {
          document.title = TRANSLATIONS[lang].title;
        }

        document.querySelectorAll(".lang-switch button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });

        document.documentElement.lang = lang;
      }

      function initLanguage() {
        setLanguage(currentLang);
        document.querySelectorAll(".lang-switch button").forEach((btn) => {
          btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
        });
      }

      // ═══════════════════════════════════════════
      //  CONFIGURATION
      // ═══════════════════════════════════════════
      // Lauks ir viss laukums zem joslas: izmērs CSS pikseļos seko kanvai (resizeCanvas), ne otrādi (Ansis 05.10)
      let FIELD_W = 0;
      let FIELD_H = 0;
      const TEST_CHARGE_R = 14;
      const CHARGE_R = 16;

      // Physics
      const COULOMB_K = 1000000;
      const MIN_DIST = 22;

      // Colors
      // Kanvas krāsas: trīs komplekti — neons (kā līdz šim), rasējums tumšs, rasējums gaišs. COL vienmēr ir aktīvais (applySkin).
      const PALETTES = {
        neon: {
          glow: true,
          font: "Orbitron, monospace",
          bg: "#080d18",
          field: "#0a1020",
          grid: "rgba(100,160,255,0.04)",
          positive: "#ff3355",
          posBright: "#ff6b8a",
          posGlow: "rgba(255,51,85,0.35)",
          posCore: "rgba(255,150,170,0.8)",
          negative: "#3388ff",
          negBright: "#6ba3ff",
          negGlow: "rgba(51,136,255,0.35)",
          negCore: "rgba(150,180,255,0.8)",
          testCharge: "#00ff88",
          testNeg: "#ff6688",
          forceArrow: "#ffcc00",
          fieldLine: "rgba(255,170,100,0.6)",
          vector: null, // gradients pēc stipruma
          equipPos: "rgba(255,140,140,0.6)",
          equipNeg: "rgba(140,180,255,0.6)",
        },
        "draw-dark": {
          glow: false,
          font: '"IBM Plex Mono", monospace',
          bg: "#0c0e11",
          field: "#0c0e11",
          grid: "rgba(232,230,225,0.06)",
          positive: "#ff3355",
          posBright: "#ff3355",
          negative: "#3388ff",
          negBright: "#3388ff",
          testCharge: "#00ff88",
          testNeg: "#ff6688",
          forceArrow: "#ffcc00",
          fieldLine: "rgba(154,152,145,0.85)",
          vector: "232,230,225",
          equipPos: "rgba(255,51,85,0.55)",
          equipNeg: "rgba(51,136,255,0.55)",
        },
        "draw-light": {
          glow: false,
          font: '"IBM Plex Mono", monospace',
          bg: "#faf8f3",
          field: "#faf8f3",
          grid: "rgba(38,38,31,0.07)",
          positive: "#c8203f",
          posBright: "#c8203f",
          negative: "#1f5fc4",
          negBright: "#1f5fc4",
          testCharge: "#118a4f",
          testNeg: "#c8203f",
          forceArrow: "#8a6a00",
          fieldLine: "rgba(122,119,109,0.9)",
          vector: "38,38,31",
          equipPos: "rgba(200,32,63,0.55)",
          equipNeg: "rgba(31,95,196,0.55)",
        },
      };
      const COL = {};

      // Zīmē tikai, kad kaut kas mainījies (lādiņš, slēdzis, pele uz lauka, izmērs, āda); cilpa pa tukšo neko nedara
      let dirty = true;
      function markDirty() {
        dirty = true;
      }

      // ═══════════════════════════════════════════
      //  ĀDA (neons / rasējums) UN TĒMA — izvēle paliek ierīcē; tēmas atslēga kopīga ar jaunajām lapām
      // ═══════════════════════════════════════════
      const SKIN_KEY = "fiz-sim-skin";
      const THEME_KEY = "fiz-sim-theme";
      const load = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
      const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* privātais režīms */ } };
      let skin = load(SKIN_KEY) === "draw" ? "draw" : "neon";
      let theme = load(THEME_KEY) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      const isDraw = () => skin === "draw";
      function applySkin() {
        document.documentElement.dataset.skin = skin;
        document.documentElement.dataset.theme = isDraw() ? theme : "dark";
        for (const k of Object.keys(COL)) delete COL[k];
        Object.assign(COL, PALETTES[isDraw() ? `draw-${theme}` : "neon"]);
        document.querySelectorAll("#skinSwitch button[data-skin]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.skin === skin)));
        markDirty();
      }
      applySkin();

      // ═══════════════════════════════════════════
      //  STATE
      // ═══════════════════════════════════════════
      const canvas = document.getElementById("fieldCanvas");
      const ctx = canvas.getContext("2d");

      // State
      let selectedCharge = +1;
      let showField = true;
      let showFieldLines = false;
      let showEquipotential = false;
      let showForce = true;

      // Objects
      let testCharge = null;
      let charges = [];
      let fieldCache = null;
      let fieldCacheDirty = true;
      let fieldMaxMag = 1;

      // Interaction
      let dragTarget = null; // { type:'charge'|'test', index } or null
      let mouseField = { x: -1, y: -1 };
      let mouseOnField = false;


      // ═══════════════════════════════════════════
      //  INITIALIZATION
      // ═══════════════════════════════════════════
      function addTestCharge() {
        testCharge = {
          x: FIELD_W / 2,
          y: FIELD_H / 2,
          charge: parseInt(document.getElementById("chargeSlider").value),
          radius: TEST_CHARGE_R,
        };
        updateTestChargeUI();
      }

      function removeTestCharge() {
        testCharge = null;
        updateTestChargeUI();
      }

      function resizeCanvas() {
        const wrap = document.getElementById("canvas-wrap");
        const w = Math.max(1, Math.round(wrap.clientWidth));
        const h = Math.max(1, Math.round(wrap.clientHeight));
        const dpr = window.devicePixelRatio || 1;
        if (w === FIELD_W && h === FIELD_H && canvas.width === Math.round(w * dpr)) return;

        // Lādiņi paliek proporcionāli savās vietās, kad logs maina izmēru
        if (FIELD_W > 0 && FIELD_H > 0) {
          const kx = w / FIELD_W;
          const ky = h / FIELD_H;
          for (const c of charges) {
            c.x *= kx;
            c.y *= ky;
          }
          if (testCharge) {
            testCharge.x *= kx;
            testCharge.y *= ky;
          }
        }
        FIELD_W = w;
        FIELD_H = h;
        for (const c of charges) {
          c.x = Math.max(CHARGE_R, Math.min(FIELD_W - CHARGE_R, c.x));
          c.y = Math.max(CHARGE_R, Math.min(FIELD_H - CHARGE_R, c.y));
        }
        if (testCharge) {
          testCharge.x = Math.max(TEST_CHARGE_R, Math.min(FIELD_W - TEST_CHARGE_R, testCharge.x));
          testCharge.y = Math.max(TEST_CHARGE_R, Math.min(FIELD_H - TEST_CHARGE_R, testCharge.y));
        }

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        fieldCacheDirty = true;
        invalidatePotentialCache();
        markDirty();
      }

      // ═══════════════════════════════════════════
      //  PHYSICS
      // ═══════════════════════════════════════════
      function computeForceOn(px, py, pCharge, excludeIndex) {
        let fx = 0,
          fy = 0;
        for (let i = 0; i < charges.length; i++) {
          if (i === excludeIndex) continue;
          const c = charges[i];
          let dx = px - c.x;
          let dy = py - c.y;
          let distSq = dx * dx + dy * dy;
          let dist = Math.sqrt(distSq);
          if (dist < MIN_DIST) dist = MIN_DIST;
          distSq = dist * dist;

          const forceMag = (COULOMB_K * pCharge * c.charge) / distSq;
          fx += (forceMag * dx) / dist;
          fy += (forceMag * dy) / dist;
        }
        return { fx, fy };
      }

      // ═══════════════════════════════════════════
      //  FIELD VISUALIZATION
      // ═══════════════════════════════════════════
      function computeFieldGrid() {
        if (!fieldCacheDirty && fieldCache) return fieldCache;

        const spacing = 40;
        const cols = Math.floor(FIELD_W / spacing);
        const rows = Math.floor(FIELD_H / spacing);
        const grid = [];

        for (let r = 0; r <= rows; r++) {
          for (let c = 0; c <= cols; c++) {
            const x = c * spacing + spacing / 2;
            const y = r * spacing + spacing / 2;
            if (x > FIELD_W || y > FIELD_H) continue;

            let ex = 0,
              ey = 0;
            for (const ch of charges) {
              const dx = x - ch.x;
              const dy = y - ch.y;
              let dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < MIN_DIST) dist = MIN_DIST;
              const eMag = (COULOMB_K * ch.charge) / (dist * dist);
              ex += (eMag * dx) / dist;
              ey += (eMag * dy) / dist;
            }

            const mag = Math.sqrt(ex * ex + ey * ey);
            grid.push({ x, y, ex, ey, mag });
          }
        }

        let maxMag = 1;
        for (const g of grid) {
          if (g.mag > maxMag) maxMag = g.mag;
        }
        fieldMaxMag = maxMag;

        fieldCache = grid;
        fieldCacheDirty = false;
        return grid;
      }

      // ═══════════════════════════════════════════
      //  RENDERING
      // ═══════════════════════════════════════════
      function render() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = COL.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        drawFieldBackground();
        if (showEquipotential && charges.length > 0) drawEquipotentialLines();
        if (showFieldLines && charges.length > 0) drawFieldLines();
        if (showField && charges.length > 0) drawFieldVectors();
        drawCharges();
        drawTestCharge();
        if (showForce && charges.length > 0) drawForceArrow();
        if (mouseOnField && !dragTarget) drawGhostCharge();
      }

      function drawFieldBackground() {
        // Field area
        ctx.fillStyle = COL.field;
        ctx.fillRect(0, 0, FIELD_W, FIELD_H);

        // Subtle grid
        ctx.strokeStyle = COL.grid;
        ctx.lineWidth = 0.5;
        const spacing = 40;
        for (let x = spacing; x < FIELD_W; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, FIELD_H);
          ctx.stroke();
        }
        for (let y = spacing; y < FIELD_H; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(FIELD_W, y);
          ctx.stroke();
        }

      }

      function drawCharges() {
        for (let i = 0; i < charges.length; i++) {
          const c = charges[i];
          const isPos = c.charge > 0;
          const color = isPos ? COL.positive : COL.negative;
          const bright = isPos ? COL.posBright : COL.negBright;
          const glow = isPos ? COL.posGlow : COL.negGlow;
          const core = isPos ? COL.posCore : COL.negCore;

          const pulseScale = 1;

          if (!COL.glow) {
            // Rasējums: aplītis lādiņa krāsā, viegls pildījums, zīme iekšā (Ansis 05.10)
            ctx.save();
            ctx.beginPath();
            ctx.arc(c.x, c.y, CHARGE_R, 0, Math.PI * 2);
            ctx.fillStyle = COL.field; // necaurspīdīgs: lādiņš nosedz vektorus un līnijas zem tā (Ansis 06.10)
            ctx.fill();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.14;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.lineCap = "round";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(c.x - 7, c.y);
            ctx.lineTo(c.x + 7, c.y);
            ctx.stroke();
            if (isPos) {
              ctx.beginPath();
              ctx.moveTo(c.x, c.y - 7);
              ctx.lineTo(c.x, c.y + 7);
              ctx.stroke();
            }
            ctx.restore();
            continue;
          }

          ctx.save();

          // Outer glow rings
          ctx.shadowColor = color;
          ctx.shadowBlur = 25;

          ctx.globalAlpha = 0.2;
          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R * 1.8 * pulseScale, 0, Math.PI * 2);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.globalAlpha = 0.3;
          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R * 1.4 * pulseScale, 0, Math.PI * 2);
          ctx.stroke();

          // Main circle with gradient
          ctx.globalAlpha = 1;
          const chargeGradient = ctx.createRadialGradient(
            c.x - CHARGE_R * 0.3,
            c.y - CHARGE_R * 0.3,
            0,
            c.x,
            c.y,
            CHARGE_R * 1.2
          );
          chargeGradient.addColorStop(0, core);
          chargeGradient.addColorStop(0.4, glow);
          chargeGradient.addColorStop(1, "rgba(0,0,0,0)");

          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R * 1.1, 0, Math.PI * 2);
          ctx.fillStyle = chargeGradient;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R, 0, Math.PI * 2);
          ctx.strokeStyle = bright;
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R - 3, 0, Math.PI * 2);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.4;
          ctx.stroke();

          ctx.restore();

          // Symbol with glow
          ctx.save();
          ctx.shadowColor = bright;
          ctx.shadowBlur = 8;
          ctx.strokeStyle = bright;
          ctx.lineCap = "round";
          ctx.lineWidth = 3;
          const symLen = 7;

          ctx.beginPath();
          ctx.moveTo(c.x - symLen, c.y);
          ctx.lineTo(c.x + symLen, c.y);
          ctx.stroke();

          if (isPos) {
            ctx.beginPath();
            ctx.moveTo(c.x, c.y - symLen);
            ctx.lineTo(c.x, c.y + symLen);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawTestCharge() {
        if (!testCharge) return;

        const isPositive = testCharge.charge >= 0;
        const tcColor = isPositive ? COL.testCharge : COL.testNeg;
        const tcFill = isPositive
          ? "rgba(0,255,136,0.2)"
          : "rgba(255,102,136,0.2)";

        ctx.save();
        if (COL.glow) {
          ctx.shadowColor = tcColor;
          ctx.shadowBlur = 20;
        }

        ctx.beginPath();
        ctx.arc(testCharge.x, testCharge.y, TEST_CHARGE_R, 0, Math.PI * 2);
        if (!COL.glow) {
          ctx.fillStyle = COL.field;
          ctx.fill();
        }
        ctx.fillStyle = tcFill;
        ctx.fill();
        ctx.strokeStyle = tcColor;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // Symbol
        ctx.strokeStyle = tcColor;
        ctx.lineCap = "round";
        ctx.lineWidth = 2.5;
        const symLen = 6;
        ctx.beginPath();
        ctx.moveTo(testCharge.x - symLen, testCharge.y);
        ctx.lineTo(testCharge.x + symLen, testCharge.y);
        ctx.stroke();
        if (isPositive) {
          ctx.beginPath();
          ctx.moveTo(testCharge.x, testCharge.y - symLen);
          ctx.lineTo(testCharge.x, testCharge.y + symLen);
          ctx.stroke();
        }

        // Label
        ctx.save();
        ctx.font = `bold 9px ${COL.font}`;
        ctx.fillStyle = tcColor;
        ctx.textAlign = "center";
        ctx.globalAlpha = 0.7;
        ctx.fillText("TEST", testCharge.x, testCharge.y + TEST_CHARGE_R + 12);
        ctx.restore();
      }

      // ═══════════════════════════════════════════
      //  FIELD LINES - trace paths following field direction
      // ═══════════════════════════════════════════
      let fieldLinesCache = null;
      let fieldLinesCacheDirty = true;

      function drawFieldLines() {
        const linesPerCharge = 16;
        const stepSize = 2; // Smaller steps for smoother curves
        const maxSteps = 2000;

        // Helper: calculate field at a point
        function getField(x, y) {
          let ex = 0, ey = 0;
          for (const c of charges) {
            const dx = x - c.x;
            const dy = y - c.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 1) dist = 1;
            // Use 1/r² for magnitude, direction is (dx,dy)/dist
            const eMag = c.charge / (dist * dist);
            ex += eMag * dx / dist;
            ey += eMag * dy / dist;
          }
          const mag = Math.sqrt(ex * ex + ey * ey);
          return { ex, ey, mag };
        }

        // Helper: distance to nearest charge of given sign
        function distToCharge(x, y, chargeSign) {
          let minDist = Infinity;
          for (const c of charges) {
            if (chargeSign !== undefined && Math.sign(c.charge) !== chargeSign) continue;
            const dx = x - c.x;
            const dy = y - c.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist) minDist = dist;
          }
          return minDist;
        }

        // Helper: check if out of bounds
        function outOfBounds(x, y) {
          return x < -10 || x > FIELD_W + 10 || y < -10 || y > FIELD_H + 10;
        }

        // Trace a single field line using RK4 for better accuracy
        function traceLine(startX, startY, direction, sourceCharge) {
          let x = startX, y = startY;
          const points = [{ x, y }];

          for (let step = 0; step < maxSteps; step++) {
            // RK4 integration for smoother curves
            const k1 = getField(x, y);
            if (k1.mag < 1e-10) break;

            const dx1 = direction * k1.ex / k1.mag;
            const dy1 = direction * k1.ey / k1.mag;

            const k2 = getField(x + dx1 * stepSize / 2, y + dy1 * stepSize / 2);
            if (k2.mag < 1e-10) break;

            const dx2 = direction * k2.ex / k2.mag;
            const dy2 = direction * k2.ey / k2.mag;

            const k3 = getField(x + dx2 * stepSize / 2, y + dy2 * stepSize / 2);
            if (k3.mag < 1e-10) break;

            const dx3 = direction * k3.ex / k3.mag;
            const dy3 = direction * k3.ey / k3.mag;

            const k4 = getField(x + dx3 * stepSize, y + dy3 * stepSize);
            if (k4.mag < 1e-10) break;

            const dx4 = direction * k4.ex / k4.mag;
            const dy4 = direction * k4.ey / k4.mag;

            // RK4 weighted average
            x += stepSize * (dx1 + 2*dx2 + 2*dx3 + dx4) / 6;
            y += stepSize * (dy1 + 2*dy2 + 2*dy3 + dy4) / 6;

            // Check if reached a negative charge (for positive source)
            if (direction > 0) {
              const distNeg = distToCharge(x, y, -1);
              if (distNeg < CHARGE_R) {
                points.push({ x, y });
                break;
              }
            }

            // Check if reached a positive charge (for negative source / reverse trace)
            if (direction < 0) {
              const distPos = distToCharge(x, y, 1);
              if (distPos < CHARGE_R) {
                points.push({ x, y });
                break;
              }
            }

            // Check if getting too close to same-sign charge (other than source)
            const distSame = distToCharge(x, y, direction > 0 ? 1 : -1);
            if (distSame < CHARGE_R * 1.5) {
              // Check if it's not our source charge
              const distToSource = Math.sqrt((x - sourceCharge.x) ** 2 + (y - sourceCharge.y) ** 2);
              if (distToSource > CHARGE_R * 2) {
                // We're near another same-sign charge, stop
                break;
              }
            }

            points.push({ x, y });

            // Stop if out of bounds
            if (outOfBounds(x, y)) break;
          }

          return points;
        }

        // Helper: draw arrowhead at position with given direction
        function drawArrow(x, y, dx, dy) {
          const arrowSize = 8;
          const angle = Math.atan2(dy, dx);
          const angle1 = angle + Math.PI * 0.8;
          const angle2 = angle - Math.PI * 0.8;

          ctx.beginPath();
          ctx.moveTo(x + Math.cos(angle1) * arrowSize, y + Math.sin(angle1) * arrowSize);
          ctx.lineTo(x, y);
          ctx.lineTo(x + Math.cos(angle2) * arrowSize, y + Math.sin(angle2) * arrowSize);
          ctx.stroke();
        }

        // Helper: draw line with arrows at 1/3 and 2/3 positions
        function drawLineWithArrows(points, direction) {
          if (points.length < 2) return;

          // Draw the line
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let j = 1; j < points.length; j++) {
            ctx.lineTo(points[j].x, points[j].y);
          }
          ctx.stroke();

          // Calculate cumulative distances
          const distances = [0];
          let totalLength = 0;
          for (let j = 1; j < points.length; j++) {
            const dx = points[j].x - points[j-1].x;
            const dy = points[j].y - points[j-1].y;
            totalLength += Math.sqrt(dx * dx + dy * dy);
            distances.push(totalLength);
          }

          if (totalLength < 30) return; // Too short for arrows

          // Find points at 1/3 and 2/3
          const targetDistances = [totalLength / 3, totalLength * 2 / 3];

          for (const targetDist of targetDistances) {
            // Find segment containing this distance
            for (let j = 1; j < distances.length; j++) {
              if (distances[j] >= targetDist) {
                // Interpolate position
                const segmentStart = distances[j-1];
                const segmentLength = distances[j] - segmentStart;
                const t = (targetDist - segmentStart) / segmentLength;

                const px = points[j-1].x + t * (points[j].x - points[j-1].x);
                const py = points[j-1].y + t * (points[j].y - points[j-1].y);

                // Direction along line (positive = away from positive charge)
                const dx = points[j].x - points[j-1].x;
                const dy = points[j].y - points[j-1].y;

                drawArrow(px, py, dx * direction, dy * direction);
                break;
              }
            }
          }
        }

        // Re-trace lines only when charges changed (cache holds field-space polylines)
        if (fieldLinesCacheDirty || !fieldLinesCache) {
          fieldLinesCache = [];

          // Count positive and negative charges
          const posCharges = charges.filter(c => c.charge > 0);
          const negCharges = charges.filter(c => c.charge < 0);

          // Trace field lines from positive charges
          for (const charge of posCharges) {
            for (let i = 0; i < linesPerCharge; i++) {
              const angle = (i / linesPerCharge) * Math.PI * 2;
              const startX = charge.x + Math.cos(angle) * (CHARGE_R + 2);
              const startY = charge.y + Math.sin(angle) * (CHARGE_R + 2);

              const points = traceLine(startX, startY, 1, charge);
              fieldLinesCache.push(points);
            }
          }

          // Trace field lines TO negative charges from infinity
          // For each negative charge, trace backward to find where lines come from
          for (const charge of negCharges) {
            for (let i = 0; i < linesPerCharge; i++) {
              const angle = (i / linesPerCharge) * Math.PI * 2;
              const startX = charge.x + Math.cos(angle) * (CHARGE_R + 2);
              const startY = charge.y + Math.sin(angle) * (CHARGE_R + 2);

              // Trace backward (against field direction)
              const points = traceLine(startX, startY, -1, charge);

              // Check if this line reached a positive charge
              if (points.length > 2) {
                const endPt = points[points.length - 1];
                let reachedPositive = false;
                for (const pc of posCharges) {
                  const dx = endPt.x - pc.x;
                  const dy = endPt.y - pc.y;
                  if (dx * dx + dy * dy < CHARGE_R * CHARGE_R * 4) {
                    reachedPositive = true;
                    break;
                  }
                }

                // Only keep if this line comes from infinity (not from a positive charge)
                if (!reachedPositive && points.length > 10) {
                  fieldLinesCache.push(points.slice().reverse());
                }
              }
            }
          }

          fieldLinesCacheDirty = false;
        }

        ctx.save();
        ctx.strokeStyle = COL.fieldLine;
        ctx.lineWidth = 1;
        ctx.lineCap = "round";

        // Draw cached polylines (all oriented away from positive / toward negative)
        for (const points of fieldLinesCache) {
          drawLineWithArrows(points, 1);
        }

        ctx.restore();
      }

      // ═══════════════════════════════════════════
      //  EQUIPOTENTIAL LINES - Marching Squares Contours
      // ═══════════════════════════════════════════
      let potentialGridCache = null;
      let potentialCacheDirty = true;
      let potentialGridGeneration = 0;
      // Režģa solis seko laukuma izmēram: 6 px pie 880 × 560 (kā līdz šim), lielākā laukā retāks, lai pārrēķins paliek ātrs
      function potentialGridSpacing() {
        return Math.max(6, Math.round(Math.sqrt((FIELD_W * FIELD_H) / 13700)));
      }

      // Every charge mutation goes through here - also invalidates traced field lines
      function invalidatePotentialCache() {
        potentialCacheDirty = true;
        fieldLinesCacheDirty = true;
      }

      function computePotentialGrid() {
        if (!potentialCacheDirty && potentialGridCache) return potentialGridCache;
        potentialCacheDirty = false;
        potentialGridGeneration++;

        const spacing = potentialGridSpacing();
        const cols = Math.ceil(FIELD_W / spacing) + 1;
        const rows = Math.ceil(FIELD_H / spacing) + 1;
        const grid = [];

        for (let r = 0; r < rows; r++) {
          const row = [];
          for (let c = 0; c < cols; c++) {
            const x = c * spacing;
            const y = r * spacing;

            // Calculate potential at this point
            let v = 0;
            let nearCharge = false;
            for (const ch of charges) {
              const dx = x - ch.x;
              const dy = y - ch.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < CHARGE_R) {
                nearCharge = true;
                break;
              }
              v += COULOMB_K * ch.charge / dist;
            }

            row.push(nearCharge ? null : v);
          }
          grid.push(row);
        }

        potentialGridCache = { grid, cols, rows, spacing };
        return potentialGridCache;
      }

      function selectContourLevels(grid) {
        // Collect valid potential values
        const values = [];
        for (const row of grid.grid) {
          for (const v of row) {
            if (v !== null && isFinite(v)) values.push(v);
          }
        }
        if (values.length === 0) return [];

        values.sort((a, b) => a - b);

        // Find range excluding extremes
        const p5 = values[Math.floor(values.length * 0.05)];
        const p95 = values[Math.floor(values.length * 0.95)];

        // Symmetric levels with the same potential step on both signs.
        // Levels absent from the grid simply produce no contour segments.
        const A = Math.max(Math.abs(p5), Math.abs(p95));
        if (A <= 0) return [];

        const levels = [];
        const step = A / 8;
        for (let i = 1; i <= 8; i++) {
          levels.push(i * step);
          levels.push(-i * step);
        }

        return levels.sort((a, b) => a - b);
      }

      function traceContourSegments(gridData, level) {
        const { grid, cols, rows, spacing } = gridData;
        const segments = [];

        // Marching squares: for each cell, find contour crossings
        for (let r = 0; r < rows - 1; r++) {
          for (let c = 0; c < cols - 1; c++) {
            const v00 = grid[r][c];
            const v10 = grid[r][c + 1];
            const v01 = grid[r + 1][c];
            const v11 = grid[r + 1][c + 1];

            // Skip cells with singularities
            if (v00 === null || v10 === null || v01 === null || v11 === null) continue;

            // Classify corners (1 = above level, 0 = below)
            const b00 = v00 > level ? 1 : 0;
            const b10 = v10 > level ? 1 : 0;
            const b01 = v01 > level ? 1 : 0;
            const b11 = v11 > level ? 1 : 0;

            const caseIndex = b00 | (b10 << 1) | (b01 << 2) | (b11 << 3);

            // Skip if all corners same side (no contour)
            if (caseIndex === 0 || caseIndex === 15) continue;

            const x0 = c * spacing;
            const y0 = r * spacing;

            // Interpolate edge crossings
            const lerp = (va, vb, x1, y1, x2, y2) => {
              const t = (level - va) / (vb - va);
              return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) };
            };

            // Edge midpoints (will interpolate)
            let top = null, bottom = null, left = null, right = null;

            if (b00 !== b10) top = lerp(v00, v10, x0, y0, x0 + spacing, y0);
            if (b01 !== b11) bottom = lerp(v01, v11, x0, y0 + spacing, x0 + spacing, y0 + spacing);
            if (b00 !== b01) left = lerp(v00, v01, x0, y0, x0, y0 + spacing);
            if (b10 !== b11) right = lerp(v10, v11, x0 + spacing, y0, x0 + spacing, y0 + spacing);

            // Connect crossings based on case
            // Case index: b00 | (b10<<1) | (b01<<2) | (b11<<3)
            // b00=top-left, b10=top-right, b01=bottom-left, b11=bottom-right
            const addSeg = (p1, p2) => { if (p1 && p2) segments.push([p1, p2]); };

            switch (caseIndex) {
              case 1: case 14: addSeg(top, left); break;
              case 2: case 13: addSeg(top, right); break;
              case 3: case 12: addSeg(left, right); break;
              case 4: case 11: addSeg(left, bottom); break;
              case 5: case 10: addSeg(top, bottom); break;
              case 7: case 8: addSeg(right, bottom); break;
              case 6: case 9: // Saddle cases - diagonal corners above
                const avg = (v00 + v10 + v01 + v11) / 4;
                if (caseIndex === 6) {
                  // top-right and bottom-left above
                  if (avg > level) {
                    addSeg(top, right); addSeg(left, bottom);
                  } else {
                    addSeg(top, left); addSeg(right, bottom);
                  }
                } else {
                  // case 9: top-left and bottom-right above
                  if (avg > level) {
                    addSeg(top, left); addSeg(right, bottom);
                  } else {
                    addSeg(top, right); addSeg(left, bottom);
                  }
                }
                break;
            }
          }
        }

        return segments;
      }

      function chainSegments(segments) {
        if (segments.length === 0) return [];

        const tolerance = 1.0;
        const chains = [];
        const used = new Set();

        // Build spatial index for fast endpoint lookup
        const endpointMap = new Map();
        const keyFor = (p) => `${Math.round(p.x)},${Math.round(p.y)}`;

        for (let i = 0; i < segments.length; i++) {
          const [p1, p2] = segments[i];
          const k1 = keyFor(p1);
          const k2 = keyFor(p2);
          if (!endpointMap.has(k1)) endpointMap.set(k1, []);
          if (!endpointMap.has(k2)) endpointMap.set(k2, []);
          endpointMap.get(k1).push({ idx: i, end: 0 });
          endpointMap.get(k2).push({ idx: i, end: 1 });
        }

        for (let startIdx = 0; startIdx < segments.length; startIdx++) {
          if (used.has(startIdx)) continue;

          const chain = [segments[startIdx][0], segments[startIdx][1]];
          used.add(startIdx);

          // Extend chain forward
          let extended = true;
          while (extended) {
            extended = false;
            const lastPt = chain[chain.length - 1];
            const key = keyFor(lastPt);
            const candidates = endpointMap.get(key) || [];

            for (const { idx, end } of candidates) {
              if (used.has(idx)) continue;
              const seg = segments[idx];
              const matchPt = seg[end];
              const otherPt = seg[1 - end];

              if (Math.abs(matchPt.x - lastPt.x) < tolerance &&
                  Math.abs(matchPt.y - lastPt.y) < tolerance) {
                chain.push(otherPt);
                used.add(idx);
                extended = true;
                break;
              }
            }
          }

          // Extend chain backward
          extended = true;
          while (extended) {
            extended = false;
            const firstPt = chain[0];
            const key = keyFor(firstPt);
            const candidates = endpointMap.get(key) || [];

            for (const { idx, end } of candidates) {
              if (used.has(idx)) continue;
              const seg = segments[idx];
              const matchPt = seg[end];
              const otherPt = seg[1 - end];

              if (Math.abs(matchPt.x - firstPt.x) < tolerance &&
                  Math.abs(matchPt.y - firstPt.y) < tolerance) {
                chain.unshift(otherPt);
                used.add(idx);
                extended = true;
                break;
              }
            }
          }

          chains.push(chain);
        }

        return chains;
      }

      let contourCache = null;

      function drawEquipotentialLines() {
        const gridData = computePotentialGrid();

        // Rebuild contours only when the potential grid was recomputed
        if (!contourCache || contourCache.generation !== potentialGridGeneration) {
          const levels = selectContourLevels(gridData);
          const chainsByLevel = levels.map((level) =>
            chainSegments(traceContourSegments(gridData, level))
          );
          contourCache = { generation: potentialGridGeneration, levels, chainsByLevel };
        }

        ctx.save();
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        for (let li = 0; li < contourCache.levels.length; li++) {
          const level = contourCache.levels[li];
          const chains = contourCache.chainsByLevel[li];

          // Color based on potential sign
          ctx.strokeStyle = level > 0 ? COL.equipPos : COL.equipNeg;

          // Draw continuous chains
          for (const chain of chains) {
            if (chain.length < 2) continue;
            ctx.beginPath();
            ctx.moveTo(chain[0].x, chain[0].y);
            for (let i = 1; i < chain.length; i++) {
              ctx.lineTo(chain[i].x, chain[i].y);
            }
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawFieldVectors() {
        const grid = computeFieldGrid();
        if (!grid.length) return;

        const maxMag = fieldMaxMag;
        const arrowLen = 42;

        for (const pt of grid) {
          if (pt.mag < 0.01) continue;

          const strength = Math.min(pt.mag / maxMag, 1);
          const len = arrowLen * Math.pow(strength, 0.35);
          const angle = Math.atan2(pt.ey, pt.ex);

          const endX = pt.x + Math.cos(angle) * len;
          const endY = pt.y + Math.sin(angle) * len;

          const hue = 180 + strength * 20;
          const lightness = 50 + strength * 20;
          const alpha = 0.25 + strength * 0.5;

          ctx.save();

          let headFill;
          if (COL.vector) {
            // Rasējums: tinte, caurspīdīgums pēc stipruma, bez gradienta un spīduma
            const inkA = 0.3 + strength * 0.6;
            ctx.strokeStyle = `rgba(${COL.vector},${inkA.toFixed(3)})`;
            headFill = ctx.strokeStyle;
          } else {
            if (strength > 0.5) {
              ctx.shadowColor = `hsla(${hue}, 100%, ${lightness}%, 0.4)`;
              ctx.shadowBlur = 4;
            }
            const arrowGradient = ctx.createLinearGradient(pt.x, pt.y, endX, endY);
            arrowGradient.addColorStop(0, `hsla(${hue}, 80%, ${lightness}%, ${alpha * 0.3})`);
            arrowGradient.addColorStop(1, `hsla(${hue}, 100%, ${lightness}%, ${alpha})`);
            ctx.strokeStyle = arrowGradient;
            headFill = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
          }
          ctx.lineWidth = 0.8 + strength * 0.8;
          ctx.lineCap = "round";

          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();

          const headLen = 4 + strength * 3;
          const headAngle = 0.5;
          ctx.fillStyle = headFill;
          ctx.beginPath();
          ctx.moveTo(endX, endY);
          ctx.lineTo(
            endX - Math.cos(angle - headAngle) * headLen,
            endY - Math.sin(angle - headAngle) * headLen
          );
          ctx.lineTo(
            endX - Math.cos(angle + headAngle) * headLen,
            endY - Math.sin(angle + headAngle) * headLen
          );
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }
      }

      function drawForceArrow() {
        if (!testCharge) return;
        const { fx, fy } = computeForceOn(
          testCharge.x,
          testCharge.y,
          testCharge.charge,
          -1
        );
        const mag = Math.sqrt(fx * fx + fy * fy);
        if (mag < 0.1) return;

        // Scale arrow length - 5x longer, max 400px
        const maxArrowLen = 400;
        const arrowLen = Math.min(mag * 0.1, maxArrowLen);
        const angle = Math.atan2(fy, fx);

        // Scale line width with arrow length (2 to 6 pixels)
        const lineWidth = 2 + (arrowLen / maxArrowLen) * 4;

        const endX = testCharge.x + Math.cos(angle) * arrowLen;
        const endY = testCharge.y + Math.sin(angle) * arrowLen;

        ctx.save();
        ctx.strokeStyle = COL.forceArrow;
        ctx.fillStyle = COL.forceArrow;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        if (COL.glow) {
          ctx.shadowColor = COL.forceArrow;
          ctx.shadowBlur = 6 + lineWidth;
        }

        ctx.beginPath();
        ctx.moveTo(testCharge.x, testCharge.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // Scale arrowhead with line width
        const headLen = 8 + lineWidth * 2;
        const headAngle = 0.4;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - Math.cos(angle - headAngle) * headLen,
          endY - Math.sin(angle - headAngle) * headLen
        );
        ctx.lineTo(
          endX - Math.cos(angle + headAngle) * headLen,
          endY - Math.sin(angle + headAngle) * headLen
        );
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawGhostCharge() {
        if (mouseField.x < 0 || mouseField.y < 0) return;
        if (mouseField.x > FIELD_W || mouseField.y > FIELD_H) return;

        const isPos = selectedCharge > 0;
        const color = isPos ? COL.positive : COL.negative;

        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(mouseField.x, mouseField.y, CHARGE_R, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.strokeStyle = color;
        ctx.lineCap = "round";
        ctx.lineWidth = 3;
        const symLen = 8;
        ctx.beginPath();
        ctx.moveTo(mouseField.x - symLen, mouseField.y);
        ctx.lineTo(mouseField.x + symLen, mouseField.y);
        ctx.stroke();
        if (isPos) {
          ctx.beginPath();
          ctx.moveTo(mouseField.x, mouseField.y - symLen);
          ctx.lineTo(mouseField.x, mouseField.y + symLen);
          ctx.stroke();
        }
        ctx.restore();
      }

      // ═══════════════════════════════════════════
      //  INPUT HANDLING
      // ═══════════════════════════════════════════
      function canvasToField(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function findChargeAt(fx, fy) {
        for (let i = charges.length - 1; i >= 0; i--) {
          const c = charges[i];
          const dx = fx - c.x;
          const dy = fy - c.y;
          if (dx * dx + dy * dy < (CHARGE_R + 8) * (CHARGE_R + 8)) return i;
        }
        return -1;
      }

      function isOnTestCharge(fx, fy) {
        if (!testCharge) return false;
        const dx = fx - testCharge.x;
        const dy = fy - testCharge.y;
        return dx * dx + dy * dy < (TEST_CHARGE_R + 8) * (TEST_CHARGE_R + 8);
      }

      // Mouse events
      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const { x, y } = canvasToField(e.clientX, e.clientY);

        if (e.button === 2) {
          // Right-click: remove charge
          const idx = findChargeAt(x, y);
          if (idx >= 0) {
            charges.splice(idx, 1);
            fieldCacheDirty = true;
            invalidatePotentialCache();
            updateChargeCount();
            // Keep an active drag pointing at the correct charge
            if (dragTarget && dragTarget.type === "charge") {
              if (dragTarget.index === idx) {
                dragTarget = null;
              } else if (dragTarget.index > idx) {
                dragTarget.index--;
              }
            }
          }
          return;
        }

        // Check test charge first
        if (isOnTestCharge(x, y)) {
          dragTarget = { type: "test", ox: testCharge.x - x, oy: testCharge.y - y };
          return;
        }

        // Check existing charges
        const idx = findChargeAt(x, y);
        if (idx >= 0) {
          dragTarget = {
            type: "charge",
            index: idx,
            ox: charges[idx].x - x,
            oy: charges[idx].y - y,
          };
        } else if (x > 0 && x < FIELD_W && y > 0 && y < FIELD_H) {
          // Place new charge
          charges.push({ x, y, charge: selectedCharge });
          fieldCacheDirty = true;
          invalidatePotentialCache();
          updateChargeCount();
          dragTarget = {
            type: "charge",
            index: charges.length - 1,
            ox: 0,
            oy: 0,
          };
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        const { x, y } = canvasToField(e.clientX, e.clientY);
        mouseField.x = x;
        mouseField.y = y;
        mouseOnField = x >= 0 && x <= FIELD_W && y >= 0 && y <= FIELD_H;

        if (dragTarget) {
          if (dragTarget.type === "test") {
            testCharge.x = Math.max(
              TEST_CHARGE_R,
              Math.min(FIELD_W - TEST_CHARGE_R, x + dragTarget.ox)
            );
            testCharge.y = Math.max(
              TEST_CHARGE_R,
              Math.min(FIELD_H - TEST_CHARGE_R, y + dragTarget.oy)
            );
          } else if (dragTarget.type === "charge") {
            const c = charges[dragTarget.index];
            if (c) {
              c.x = Math.max(CHARGE_R, Math.min(FIELD_W - CHARGE_R, x + dragTarget.ox));
              c.y = Math.max(CHARGE_R, Math.min(FIELD_H - CHARGE_R, y + dragTarget.oy));
              fieldCacheDirty = true;
              invalidatePotentialCache();
            }
          }
        }
      });

      canvas.addEventListener("mouseup", () => {
        dragTarget = null;
      });

      canvas.addEventListener("mouseleave", () => {
        mouseOnField = false;
        dragTarget = null;
      });

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      // Touch events - single tracked touch, long-press on existing charge removes it
      let longPressTimer = null;
      let longPressStart = null;
      let trackedTouchId = null;
      const LONG_PRESS_MOVE_CANCEL = 10; // field units before long-press is cancelled

      function endTrackedTouch(e) {
        if (trackedTouchId === null) return;
        let ended = false;
        for (const t of e.changedTouches) {
          if (t.identifier === trackedTouchId) {
            ended = true;
            break;
          }
        }
        if (!ended) return;
        trackedTouchId = null;
        clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressStart = null;
        dragTarget = null;
        mouseOnField = false;
      }

      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          if (trackedTouchId !== null) return; // Ignore extra fingers
          const touch = e.changedTouches[0];
          trackedTouchId = touch.identifier;
          const { x, y } = canvasToField(touch.clientX, touch.clientY);

          // Test charge drag - never arms the delete timer
          if (isOnTestCharge(x, y)) {
            dragTarget = { type: "test", ox: testCharge.x - x, oy: testCharge.y - y };
            return;
          }

          const idx = findChargeAt(x, y);
          if (idx >= 0) {
            // Existing charge: start drag and arm long-press delete
            dragTarget = {
              type: "charge",
              index: idx,
              ox: charges[idx].x - x,
              oy: charges[idx].y - y,
            };
            longPressStart = { x, y };
            longPressTimer = setTimeout(() => {
              charges.splice(idx, 1);
              fieldCacheDirty = true;
              invalidatePotentialCache();
              updateChargeCount();
              dragTarget = null;
              longPressTimer = null;
              longPressStart = null;
              markDirty();
            }, 500);
          } else if (x > 0 && x < FIELD_W && y > 0 && y < FIELD_H) {
            // Empty field: place new charge, no delete timer
            charges.push({ x, y, charge: selectedCharge });
            fieldCacheDirty = true;
            invalidatePotentialCache();
            updateChargeCount();
            dragTarget = {
              type: "charge",
              index: charges.length - 1,
              ox: 0,
              oy: 0,
            };
          }
        },
        { passive: false }
      );

      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (trackedTouchId === null) return;
          let touch = null;
          for (const t of e.touches) {
            if (t.identifier === trackedTouchId) {
              touch = t;
              break;
            }
          }
          if (!touch) return;
          const { x, y } = canvasToField(touch.clientX, touch.clientY);
          mouseField.x = x;
          mouseField.y = y;
          mouseOnField = true;

          // Cancel long-press delete once the finger moves past a small threshold
          if (longPressTimer !== null && longPressStart) {
            const mdx = x - longPressStart.x;
            const mdy = y - longPressStart.y;
            if (mdx * mdx + mdy * mdy > LONG_PRESS_MOVE_CANCEL * LONG_PRESS_MOVE_CANCEL) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
              longPressStart = null;
            }
          }

          if (dragTarget) {
            if (dragTarget.type === "test") {
              testCharge.x = Math.max(
                TEST_CHARGE_R,
                Math.min(FIELD_W - TEST_CHARGE_R, x + dragTarget.ox)
              );
              testCharge.y = Math.max(
                TEST_CHARGE_R,
                Math.min(FIELD_H - TEST_CHARGE_R, y + dragTarget.oy)
              );
            } else if (dragTarget.type === "charge") {
              const c = charges[dragTarget.index];
              if (c) {
                c.x = Math.max(CHARGE_R, Math.min(FIELD_W - CHARGE_R, x + dragTarget.ox));
                c.y = Math.max(CHARGE_R, Math.min(FIELD_H - CHARGE_R, y + dragTarget.oy));
                fieldCacheDirty = true;
                invalidatePotentialCache();
              }
            }
          }
        },
        { passive: false }
      );

      canvas.addEventListener("touchend", endTrackedTouch);
      canvas.addEventListener("touchcancel", endTrackedTouch);

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target && e.target.tagName === "INPUT") return;
        if (e.code === "KeyF") {
          setShown("field", !showField);
        } else if (e.code === "KeyC") {
          doClear();
        }
      });

      // ═══════════════════════════════════════════
      //  UI CONTROLS — viens pogu komplekts visām ierīcēm
      // ═══════════════════════════════════════════
      function updateChargeCount() {
        document.getElementById("chargeCount").textContent = charges.length;
      }

      function doClear() {
        charges = [];
        testCharge = null;
        fieldCacheDirty = true;
        invalidatePotentialCache();
        updateChargeCount();
        updateTestChargeUI();
        markDirty();
      }

      document.getElementById("chargeBtns").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-charge]");
        if (!btn) return;
        selectChargeType(parseFloat(btn.dataset.charge));
      });

      function selectChargeType(val) {
        selectedCharge = val;
        document.querySelectorAll("#chargeBtns button[data-charge]").forEach((b) => {
          const mine = (parseFloat(b.dataset.charge) > 0) === (val > 0);
          b.classList.toggle("active-pos", mine && val > 0);
          b.classList.toggle("active-neg", mine && val < 0);
        });
        markDirty();
      }

      document.getElementById("btnClear").addEventListener("click", doClear);

      document.getElementById("skinSwitch").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-skin]");
        if (!b || b.dataset.skin === skin) return;
        skin = b.dataset.skin;
        save(SKIN_KEY, skin);
        applySkin();
      });
      document.getElementById("skinBtn").addEventListener("click", () => {
        skin = isDraw() ? "neon" : "draw";
        save(SKIN_KEY, skin);
        applySkin();
      });
      document.getElementById("themeBtn").addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        save(THEME_KEY, theme);
        applySkin();
      });

      function updateTestChargeUI() {
        document.getElementById("btnAddTest").hidden = Boolean(testCharge);
        document.getElementById("testChargeControls").hidden = !testCharge;
        markDirty();
      }

      document.getElementById("btnAddTest").addEventListener("click", addTestCharge);
      document.getElementById("btnRemoveTest").addEventListener("click", removeTestCharge);

      function syncTestChargeSlider(value) {
        const val = parseInt(value, 10);
        if (testCharge) testCharge.charge = val;
        document.getElementById("chargeSlider").value = val;
        document.getElementById("chargeVal").textContent = val > 0 ? "+" + val : String(val);
        markDirty();
      }
      document.getElementById("chargeSlider").addEventListener("input", (e) => syncTestChargeSlider(e.target.value));

      // RĀDĪT — ieslēdzamas pogas; viena funkcija arī tastatūrai (F)
      const SHOW = {
        field: { get: () => showField, set: (v) => (showField = v) },
        lines: { get: () => showFieldLines, set: (v) => (showFieldLines = v) },
        equip: { get: () => showEquipotential, set: (v) => (showEquipotential = v) },
        force: { get: () => showForce, set: (v) => (showForce = v) },
      };
      function setShown(key, on) {
        SHOW[key].set(on);
        const btn = document.querySelector(`#displayBtns button[data-show="${key}"]`);
        if (btn) btn.setAttribute("aria-pressed", String(on));
        markDirty();
      }
      document.getElementById("displayBtns").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-show]");
        if (!btn) return;
        setShown(btn.dataset.show, !SHOW[btn.dataset.show].get());
      });
      Object.keys(SHOW).forEach((key) => setShown(key, SHOW[key].get()));

      // Pele un pirksts uz lauka: pēc katra notikuma pārzīmē (spoku lādiņš seko kursoram, vilkšana kustina)
      ["mousedown", "mousemove", "mouseup", "mouseleave", "touchstart", "touchmove", "touchend", "touchcancel"].forEach((type) =>
        canvas.addEventListener(type, markDirty)
      );

      // ═══════════════════════════════════════════
      //  RENDER LOOP
      // ═══════════════════════════════════════════
      function loop() {
        if (dirty) {
          dirty = false;
          render();
        }
        requestAnimationFrame(loop);
      }

      // ═══════════════════════════════════════════
      //  START
      // ═══════════════════════════════════════════
      // Lauka izmēru nosaka tā laukums (arī kad josla pārlūst citā rindu skaitā), ne tikai logs
      new ResizeObserver(resizeCanvas).observe(document.getElementById("canvas-wrap"));
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      initLanguage();
      updateTestChargeUI();
      loop();
    </script>
  </body>
</html>
