<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Electric Field Hockey</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Āda (neons / rasējums) un rasējuma tēma pirms pirmā zīmējuma, lai nemirgo; tās pašas atslēgas kā jaunajās lapās (tēma)
      (function () {
        try {
          var s = localStorage.getItem("fiz-sim-skin") === "draw" ? "draw" : "neon";
          var t = localStorage.getItem("fiz-sim-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.skin = s;
          document.documentElement.dataset.theme = s === "draw" ? t : "dark";
        } catch (e) {}
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #060a14;
        --panel: #0c1220;
        --panel-border: #1a2540;
        --accent: #00ccff;
        --accent-dim: #00ccff44;
        --positive: #ff3355;
        --positive-glow: #ff335566;
        --negative: #3388ff;
        --negative-glow: #3388ff66;
        --puck: #00ff88;
        --goal: #ffd700;
        --text: #c8d6e8;
        --text-dim: #5a6d88;
        --text-muted: #354050;
        --font-display: "Orbitron", monospace;
        --font-body: "Exo 2", sans-serif;
        --radius: 6px;
        --header-bg: linear-gradient(180deg, #0d1525 0%, var(--bg) 100%);
      }
      /* ── Rasējuma āda: tie paši marķieri kā assets/sim-common.css (grafīts / papīrs), bez spīdumiem un noapaļojumiem ── */
      :root[data-skin="draw"] {
        --sheet: #15171b;
        --ink: #e8e6e1;
        --ink-dim: #9a9891;
        --hairline: #3a3d42;
        --field: #0c0e11;
        --accent: #ff7a29;
        --accent-dim: transparent;
        --bg: var(--sheet);
        --panel: var(--sheet);
        --panel-border: var(--hairline);
        --text: var(--ink);
        --text-dim: var(--ink-dim);
        --text-muted: var(--ink-dim);
        --positive: #ff3355;
        --positive-glow: transparent;
        --negative: #3388ff;
        --negative-glow: transparent;
        --puck: #00ff88;
        --goal: #ffd700;
        --font-display: "IBM Plex Mono", monospace;
        --font-body: "IBM Plex Mono", monospace;
        --radius: 0;
        --header-bg: var(--sheet);
      }
      :root[data-skin="draw"][data-theme="light"] {
        --sheet: #f2efe9;
        --ink: #26261f;
        --ink-dim: #7a776d;
        --hairline: #c9c4b8;
        --field: #faf8f3;
        --accent: #c75612;
        --positive: #c8203f;
        --negative: #1f5fc4;
        --puck: #118a4f;
        --goal: #8a6a00;
      }

      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        height: 100vh;
        height: 100dvh; /* telefonā pārlūka joslas nenogriež lauka apakšu */
        width: 100%;
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ═══════════════════════════════════════════
         HEADER
         ═══════════════════════════════════════════ */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 12px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--panel-border);
        flex-shrink: 0;
        min-height: 42px;
      }
      .back-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
      }
      .back-btn:hover { color: var(--accent); }
      header h1 {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--accent), #66eeff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      header .status {
        font-family: var(--font-display);
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        white-space: nowrap;
      }
      header .status.running { border-color: var(--puck); color: var(--puck); }
      header .status.won { border-color: var(--goal); color: var(--goal); }
      .header-spacer { flex: 1; }
      .sheet-no { display: none; }
      .skin-switch, .lang-switch { font-family: var(--font-display); font-size: 11px; letter-spacing: 1px; display: flex; align-items: center; }
      .skin-switch button, .theme-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 6px; font-family: inherit; font-size: inherit; letter-spacing: inherit; }
      .skin-switch button:hover, .theme-btn:hover { color: var(--text-dim); background: none; border: none; }
      .skin-switch button[aria-pressed="true"] { color: var(--accent); }
      .skin-switch .lang-sep { color: var(--text-muted); }
      .theme-btn, .skin-btn { display: none; font-size: 15px; line-height: 1; }
      .link-btn {
        background: none;
        border: 1px solid var(--accent-dim);
        color: var(--text-dim);
        padding: 4px 10px;
        border-radius: var(--radius);
        font-size: 11px;
        cursor: pointer;
        font-family: var(--font-display);
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .link-btn:hover { border-color: var(--accent); color: var(--accent); background: none; }
      .lang-switch button {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 6px;
        transition: color 0.2s;
        font-family: inherit;
        font-size: inherit;
      }
      .lang-switch button:hover { color: var(--text-dim); background: none; border: none; }
      .lang-switch button.active { color: var(--accent); }
      .lang-switch .lang-sep { color: var(--text-muted); }

      /* ═══════════════════════════════════════════
         TOOLBAR — viena josla visām ierīcēm, grupas pārlūst rindās
         ═══════════════════════════════════════════ */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        padding: 4px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
        flex-shrink: 0;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 4px 14px;
        border-right: 1px solid var(--panel-border);
      }
      .group-end { border-right: none; margin-left: auto; }
      .group-label {
        font-family: var(--font-display);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent);
        white-space: nowrap;
      }
      .group-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-height: 34px;
      }
      .charge-count {
        font-size: 13px;
        color: var(--text-dim);
        white-space: nowrap;
        padding-left: 4px;
      }
      .charge-count span { color: var(--accent); }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .slider-row .slider-sym { font-style: italic; color: var(--puck); font-size: 14px; }
      .slider-row input[type="range"] {
        width: 90px;
        accent-color: var(--puck);
        height: 6px;
      }
      .slider-row .slider-val {
        font-family: var(--font-display);
        font-size: 13px;
        min-width: 28px;
        text-align: right;
        color: var(--puck);
      }
      .hint {
        flex-basis: 100%;
        font-size: 12px;
        color: var(--text-dim);
        padding: 2px 14px 4px;
      }

      /* Pogas */
      button {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 7px 12px;
        font-family: var(--font-body);
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        white-space: nowrap;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
      }
      button.active-pos {
        background: var(--positive-glow);
        border-color: var(--positive);
        color: #fff;
      }
      button.active-neg {
        background: var(--negative-glow);
        border-color: var(--negative);
        color: #fff;
      }
      button.primary {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover { background: rgba(0, 204, 255, 0.3); }
      button.danger {
        border-color: #ff4466;
        color: #ff6688;
      }
      button.danger:hover {
        background: rgba(255, 68, 102, 0.2);
        border-color: #ff6688;
      }
      button.toggle { color: var(--text-dim); }
      button[aria-pressed="true"]:not(.toggle) {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
      }
      button.toggle[aria-pressed="true"] {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: #fff;
      }

      /* ═══════════════════════════════════════════
         LAUKUMS — viss, kas paliek zem joslas, no malas līdz malai
         ═══════════════════════════════════════════ */
      #canvas-wrap {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
      }

      /* ═══════════════════════════════════════════
         Telefons — tās pašas pogas ar vārdiem, grupas pa rindām
         ═══════════════════════════════════════════ */
      @media (max-width: 700px) {
        header { padding: 4px 8px; gap: 8px; min-height: 38px; }
        header h1 { font-size: 13px; letter-spacing: 1px; }
        .link-btn { display: none; }
        .skin-switch button[data-skin], .skin-switch .lang-sep { display: none; }
        .skin-btn { display: inline-block; }
        .toolbar { padding: 2px 4px; }
        .group { padding: 3px 6px; border-right: none; }
        .group-label { display: none; }
        .group-row { min-height: 30px; gap: 4px; }
        header h1 { font-size: 12px; letter-spacing: 0.5px; }
        .group-end { order: 0; flex-basis: 100%; margin-left: 0; }
        .group-level { order: 1; }
        .group-mode { order: 2; }
        .group-charges { order: 3; }
        .group-puck { order: 4; }
        .group-display { order: 5; flex-basis: 100%; }
        button { padding: 6px 8px; font-size: 13px; }
        .charge-count { padding-left: 0; }
        .slider-row input[type="range"] { width: 80px; }
        header .status { display: none; } /* stāvokli telefonā rāda SĀKT/PAUZE poga; virsrakstam vajag vietu */
        .hint { display: none; }
      }
      /* Zems ekrāns (telefons guļus): josla bez grupu virsrakstiem un ar mazākām pogām, lai laukumam paliek vieta */
      @media (max-height: 500px) {
        .hint { display: none; }
        header { min-height: 34px; padding: 2px 8px; }
        header h1 { font-size: 12px; letter-spacing: 1px; }
        .toolbar { padding: 2px 6px; }
        .group { padding: 2px 8px; }
        .group-label { display: none; }
        .group-row { min-height: 28px; gap: 4px; }
        button { padding: 4px 8px; font-size: 12px; }
      }
      /* ═══════════════════════════════════════════
         RASĒJUMA ĀDA — komponentes: galvene kā rasējuma lapās, pogas tintes inversijā, slīdņi kā izmēru līnijas
         ═══════════════════════════════════════════ */
      [data-skin="draw"] body { font-size: 13px; }
      [data-skin="draw"] header { padding: 0; gap: 0; min-height: 0; align-items: stretch; }
      [data-skin="draw"] .back-btn { font-size: 11px; letter-spacing: 0.08em; padding: 0 16px; border-right: 1px solid var(--hairline); color: var(--ink-dim); display: flex; align-items: center; }
      [data-skin="draw"] .back-btn:hover { background: var(--ink); color: var(--sheet); }
      [data-skin="draw"] header h1 { background: none; -webkit-text-fill-color: currentColor; color: var(--ink); font-size: 14px; font-weight: 600; letter-spacing: 0.14em; padding: 10px 16px; }
      [data-skin="draw"] .bolt { display: none; } /* rasējuma lapās zibens nav */
      [data-skin="draw"] .sheet-no { display: block; align-self: center; color: var(--ink-dim); font-family: var(--font-display); font-size: 14px; letter-spacing: 0.14em; padding-right: 16px; }
      [data-skin="draw"] .link-btn { border: none; border-left: 1px solid var(--hairline); border-radius: 0; padding: 0 12px; letter-spacing: 0.08em; color: var(--ink-dim); }
      [data-skin="draw"] .link-btn:hover { background: var(--ink); color: var(--sheet); }
      [data-skin="draw"] .skin-switch, [data-skin="draw"] .lang-switch { border-left: 1px solid var(--hairline); padding: 0 6px; letter-spacing: 0.04em; }
      [data-skin="draw"] .theme-btn { display: inline-block; }
      [data-skin="draw"] .toolbar { padding: 0 6px; }
      [data-skin="draw"] .group { padding: 7px 14px 8px; }
      [data-skin="draw"] .group-label { font-size: 9.5px; letter-spacing: 0.14em; color: var(--ink-dim); font-weight: 400; }
      [data-skin="draw"] button { background: none; border: 1px solid var(--hairline); font-size: 11px; letter-spacing: 0.1em; padding: 7px 10px; transition: none; }
      [data-skin="draw"] button:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
      [data-skin="draw"] button[aria-pressed="true"],
      [data-skin="draw"] button.toggle[aria-pressed="true"],
      [data-skin="draw"] button.active-pos,
      [data-skin="draw"] button.active-neg { background: none; border-color: var(--accent); color: var(--accent); }
      [data-skin="draw"] button.active-pos { border-color: var(--positive); color: var(--positive); }
      [data-skin="draw"] button.active-neg { border-color: var(--negative); color: var(--negative); }
      [data-skin="draw"] button.primary { background: none; border-color: var(--ink); color: var(--ink); font-weight: 600; }
      [data-skin="draw"] button.danger { border-color: var(--hairline); color: var(--ink-dim); }
      [data-skin="draw"] button.danger:hover, [data-skin="draw"] button.primary:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
      [data-skin="draw"] .charge-count { font-size: 11px; letter-spacing: 0.06em; }
      [data-skin="draw"] .charge-count span { color: var(--ink); font-weight: 500; }
      [data-skin="draw"] .slider-row .slider-sym { font-style: italic; color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
      [data-skin="draw"] .slider-row .slider-val { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
      [data-skin="draw"] input[type="range"] { -webkit-appearance: none; appearance: none; height: 26px; margin: 0; background:
        linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat,
        linear-gradient(var(--ink), var(--ink)) left center / 1px 9px no-repeat,
        linear-gradient(var(--ink), var(--ink)) right center / 1px 9px no-repeat; cursor: pointer; }
      [data-skin="draw"] input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; background: var(--sheet); border: 1px solid var(--ink); transform: rotate(45deg); }
      [data-skin="draw"] input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; background: var(--sheet); border: 1px solid var(--ink); border-radius: 0; transform: rotate(45deg); }
      [data-skin="draw"] input[type="range"]:active::-webkit-slider-thumb { background: var(--accent); border-color: var(--accent); }
      [data-skin="draw"] .hint { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 12px; color: var(--ink-dim); }
      [data-skin="draw"] canvas { cursor: crosshair; }
      [data-skin="draw"] header .status { border-radius: 0; border-color: var(--hairline); background: none; color: var(--ink-dim); letter-spacing: 0.1em; font-size: 10px; align-self: center; }
      [data-skin="draw"] header .status.running { border-color: var(--accent); color: var(--accent); }
      [data-skin="draw"] header .status.won { border-color: var(--accent); color: var(--accent); }
      /* rasējuma āda telefonā — pēc komponentēm, lai pārspēj to atstarpes */
      @media (max-width: 700px) {
        [data-skin="draw"] .sheet-no { display: none; }
        [data-skin="draw"] header h1 { font-size: 12px; letter-spacing: 0.08em; padding: 8px 8px; }
        [data-skin="draw"] .back-btn { padding: 0 10px; }
        [data-skin="draw"] button { letter-spacing: 0.04em; padding: 6px 8px; }
        [data-skin="draw"] .group { padding: 3px 6px; }
      }
      @media (max-height: 500px) {
        [data-skin="draw"] button { letter-spacing: 0.04em; padding: 4px 8px; }
        [data-skin="draw"] .group { padding: 2px 8px; }
      }
    </style>
  </head>
  <body>
    <header>
      <button class="back-btn" onclick="location.href='index.html'" title="Back" data-i18n-title="titleBack">←</button>
      <h1><span class="bolt">⚡ </span><span data-i18n="heading">ELECTRIC FIELD HOCKEY</span></h1>
      <span class="status" id="statusBadge" data-i18n="setup">SETUP</span>
      <span class="header-spacer"></span>
      <span class="sheet-no">E-02</span>
      <button class="link-btn" onclick="location.href='newtons-cannon.html'" title="Try Newton’s Cannon simulation" data-i18n-title="titleCannon">→ CANNON</button>
      <div class="skin-switch" id="skinSwitch">
        <button data-skin="neon" data-i18n="skinNeon">NEON</button>
        <span class="lang-sep">|</span>
        <button data-skin="draw" data-i18n="skinDraw">DRAWING</button>
        <button class="skin-btn" id="skinBtn" data-i18n-title="titleSkin" title="Neon / drawing">◧</button>
        <button class="theme-btn" id="themeBtn" data-i18n-title="titleTheme" title="Light / dark">◐</button>
      </div>
      <div class="lang-switch">
        <button data-lang="lv">LV</button>
        <span class="lang-sep">|</span>
        <button data-lang="en">EN</button>
      </div>
    </header>

    <!-- Viena vadības josla: datorā vienā rindā, šaurāk — grupas pārlūst, telefonā pa rindām -->
    <div class="toolbar" id="toolbar">
      <div class="group group-level">
        <span class="group-label" data-i18n="difficulty">Difficulty</span>
        <div class="group-row" id="levelBtns">
          <button data-level="practice" aria-pressed="true" data-i18n="practice">Practice</button>
          <button data-level="1" aria-pressed="false" data-i18n="level1">Level 1</button>
          <button data-level="2" aria-pressed="false" data-i18n="level2">Level 2</button>
          <button data-level="3" aria-pressed="false" data-i18n="level3">Level 3</button>
        </div>
      </div>

      <div class="group group-mode">
        <span class="group-label" data-i18n="gameMode">Game Mode</span>
        <div class="group-row" id="modeBtns">
          <button data-mode="easy" aria-pressed="true" data-i18n="easyMode">Easy</button>
          <button data-mode="hard" aria-pressed="false" data-i18n="hardMode">Hard</button>
        </div>
      </div>

      <div class="group group-charges">
        <span class="group-label" data-i18n="placeCharge">Place Charge</span>
        <div class="group-row" id="chargeBtns">
          <button class="active-pos" data-charge="+1" data-i18n="positive">⊕ Positive</button>
          <button data-charge="-1" data-i18n="negative">⊖ Negative</button>
          <span class="charge-count"><span data-i18n="chargesPlaced">Charges:</span> <span id="chargeCount">0</span></span>
        </div>
      </div>

      <div class="group group-puck">
        <span class="group-label" data-i18n="puck">Puck</span>
        <div class="group-row">
          <div class="slider-row">
            <span class="slider-sym">m</span>
            <input type="range" id="massSlider" min="1" max="100" value="25" aria-label="Puck mass" data-i18n-aria="puckMass" />
            <span class="slider-val" id="massVal">25</span>
          </div>
          <div class="slider-row">
            <span class="slider-sym">q</span>
            <input type="range" id="chargeSlider" min="-10" max="10" value="5" aria-label="Puck charge" data-i18n-aria="puckCharge" />
            <span class="slider-val" id="chargeVal">+5</span>
          </div>
        </div>
      </div>

      <div class="group group-display">
        <span class="group-label" data-i18n="display">Display</span>
        <div class="group-row" id="displayBtns">
          <button class="toggle" data-show="field" aria-pressed="false" data-i18n="electricField">Electric Field</button>
          <button class="toggle" data-show="trace" aria-pressed="true" data-i18n="puckTrace">Puck Trace</button>
          <button class="toggle" data-show="force" aria-pressed="true" data-i18n="forceArrow">Force Arrow</button>
        </div>
      </div>

      <div class="group group-end">
        <span class="group-label" data-i18n="controls">Controls</span>
        <div class="group-row">
          <button class="primary" id="btnStart" data-i18n="start">▶ START</button>
          <button id="btnReset" data-i18n="reset">↺ Reset</button>
          <button class="danger" id="btnClear" data-i18n="clear">✕ Clear</button>
        </div>
      </div>

      <p class="hint" data-i18n="hint">Click on the field to place a charge, drag to move it, right-click (or long-press) to remove it.</p>
    </div>

    <div id="canvas-wrap">

      // ═══════════════════════════════════════════
      //  CONFIGURATION
      // ═══════════════════════════════════════════
      // Laukums ir viss, kas paliek zem joslas (Ansis 05.10). Pasaules vienības: augstums ~560 kā līdz šim (mērogs no laukuma
      // augstuma, 0,5…1,25), platums seko ekrāna proporcijai — fizika (spēki, ātrumi) tāpēc jūtas vienādi dažādos ekrānos.
      const BASE_H = 560; // pasaules vienības laukuma augstumam, no kura rēķina mērogu
      let FIELD_W = 880;
      let FIELD_H = 560;
      const PUCK_R = 13;
      const CHARGE_R = 16;
      const GOAL_OPENING = 110;
      const GOAL_DEPTH = 36;
      const WALL_T = 8;

      // Physics (tuned for fun gameplay)
      const COULOMB_K = 1000000;
      const MIN_DIST = 22;
      const BOUNCE_COEFF = 0.88;
      const MAX_SPEED = 2500;
      const SUB_STEPS = 20;
      const DT = 1 / 60;

      // Physics field is 2x bigger than visible field (centered): the puck may leave the rink but resets beyond that
      function outOfPhysicsField(x, y) {
        return x < -FIELD_W / 2 || x > FIELD_W * 1.5 || y < -FIELD_H / 2 || y > FIELD_H * 1.5;
      }

      // Charge placement area extends beyond visible field by 1.2x charge diameter
      const CHARGE_MARGIN = CHARGE_R * 2 * 1.2; // ~38 pixels

      // Left clamp: the canvas shows only WALL_T px beyond the field's left edge,
      // so keep the charge disc fully visible there (top/bottom use VISUAL_MARGIN)
      const CHARGE_MIN_X = CHARGE_R - WALL_T;

      // Visual margin to show charges placed outside field (top/bottom)
      const VISUAL_MARGIN = 40;

      // Colors
      // Kanvas krāsas: neons (kā līdz šim), rasējums tumšs, rasējums gaišs. COL vienmēr ir aktīvais (applySkin).
      const PALETTES = {
        neon: {
          glow: true,
          font: "Orbitron, monospace",
          bg: "#080d18",
          field: "#0a1020",
          grid: "rgba(100,160,255,0.04)",
          wall: "#6878a0",
          wallGlow: "rgba(100,130,200,0.15)",
          wallEdge: "rgba(200,210,230,0.3)",
          goalFill: "rgba(255,215,0,0.08)",
          goalBorder: "#ffd700",
          goalNet: "rgba(255,215,0,0.25)",
          positive: "#ff3355",
          posBright: "#ff6b8a",
          posGlow: "rgba(255,51,85,0.35)",
          posCore: "rgba(255,150,170,0.8)",
          negative: "#3388ff",
          negBright: "#6ba3ff",
          negGlow: "rgba(51,136,255,0.35)",
          negCore: "rgba(150,180,255,0.8)",
          puck: "#00ff88",
          puckNeg: "#ff6688",
          puckFill: "rgba(0,255,136,0.2)",
          puckFillNeg: "rgba(255,102,136,0.2)",

        },
        "draw-dark": {
          glow: false,

          bg: "#0c0e11",
          field: "#0c0e11",
          grid: "rgba(232,230,225,0.06)",
          wall: "#9a9891",
          wallGlow: "transparent",
          wallEdge: "rgba(232,230,225,0.5)",
          goalFill: "rgba(255,215,0,0.06)",
          goalBorder: "#ffd700",
          goalNet: "rgba(255,215,0,0.3)",
          positive: "#ff3355",
          posBright: "#ff3355",
          negative: "#3388ff",
          negBright: "#3388ff",
          puck: "#00ff88",
          puckNeg: "#ff6688",
          puckFill: "rgba(0,255,136,0.18)",
          puckFillNeg: "rgba(255,102,136,0.18)",
          trail: "rgba(232,230,225,",
          vector: "232,230,225",
          forceArrow: "#ffcc00",

          winShade: "#15171b",
          winHint: "#e8e6e1",
        },
        "draw-light": {
          glow: false,
          font: '"IBM Plex Mono", monospace',
          bg: "#faf8f3",
          field: "#faf8f3",
          grid: "rgba(38,38,31,0.07)",
          wall: "#7a776d",
          wallGlow: "transparent",
          wallEdge: "rgba(38,38,31,0.5)",
          goalFill: "rgba(138,106,0,0.07)",
          goalBorder: "#8a6a00",
          goalNet: "rgba(138,106,0,0.3)",
          positive: "#c8203f",
          posBright: "#c8203f",
          negative: "#1f5fc4",
          negBright: "#1f5fc4",
          puck: "#118a4f",
          puckNeg: "#c8203f",
          puckFill: "rgba(17,138,79,0.15)",
          puckFillNeg: "rgba(200,32,63,0.15)",
          trail: "rgba(38,38,31,",
          vector: "38,38,31",
          forceArrow: "#8a6a00",
          oob: "200, 32, 63",
          winShade: "#f2efe9",
          winHint: "#26261f",
        },
      };
      const COL = {};

      // ═══════════════════════════════════════════
      //  LEVEL DEFINITIONS
      // ═══════════════════════════════════════════
      // Walls defined as {x, y, w, h} rectangles
      function makeLevelWalls(level) {
        const walls = [];
        const cw = FIELD_W,
          ch = FIELD_H;
        switch (level) {
          case "practice":
            // No internal walls
            break;
          case "1":
            // Single vertical line in center, length = 2x goal width
            const wallLen1 = GOAL_OPENING * 2;
            walls.push({ x: cw * 0.5, y: (ch - wallLen1) / 2, w: WALL_T, h: wallLen1 });
            break;
          case "2":
            // Two barriers forming a chicane
            walls.push({ x: cw * 0.35, y: 0, w: WALL_T, h: ch * 0.65 });
            walls.push({ x: cw * 0.62, y: ch * 0.35, w: WALL_T, h: ch * 0.65 });
            break;
          case "3":
            // Three barriers - maze-like
            walls.push({ x: cw * 0.25, y: 0, w: WALL_T, h: ch * 0.6 });
            walls.push({ x: cw * 0.48, y: ch * 0.3, w: WALL_T, h: ch * 0.7 });
            walls.push({ x: cw * 0.71, y: 0, w: WALL_T, h: ch * 0.55 });
            break;
        }
        return walls;
      }

      // Zīmē tikai, kad kaut kas mainījies; spēles laikā (ripa kustas, svinības, zibsnis) — katru kadru
      let dirty = true;
      function markDirty() {
        dirty = true;
      }

      // ═══════════════════════════════════════════
      //  ĀDA (neons / rasējums) UN TĒMA — izvēle paliek ierīcē; tēmas atslēga kopīga ar jaunajām lapām
      // ═══════════════════════════════════════════
      const SKIN_KEY = "fiz-sim-skin";
      const THEME_KEY = "fiz-sim-theme";
      const load = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
      const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* privātais režīms */ } };
      let skin = load(SKIN_KEY) === "draw" ? "draw" : "neon";
      let theme = load(THEME_KEY) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      const isDraw = () => skin === "draw";
      function applySkin() {
        document.documentElement.dataset.skin = skin;
        document.documentElement.dataset.theme = isDraw() ? theme : "dark";
        for (const k of Object.keys(COL)) delete COL[k];
        Object.assign(COL, PALETTES[isDraw() ? `draw-${theme}` : "neon"]);
        document.querySelectorAll("#skinSwitch button[data-skin]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.skin === skin)));
        markDirty();
      }
      applySkin();

      // ═══════════════════════════════════════════
      //  GAME STATE
      // ═══════════════════════════════════════════
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let scale = 1; // px uz pasaules vienību
      let offsetX = WALL_T; // pasaules vienībās: laukuma kreisā mala kanvā
      let offsetY = WALL_T + VISUAL_MARGIN;

      // State
      let gameState = "setup"; // setup | running | paused | won
      let currentLevel = "practice";
      let puckMass = 25;
      let puckCharge = 5;
      let selectedCharge = +1;
      let showField = false;
      let showTrace = true;
      let showForce = true;
      let hardMode = false;

      // Objects
      let puck = null;
      let charges = [];
      let walls = [];
      let trail = [];
      let particles = []; // celebration particles
      let fieldCache = null;
      let fieldCacheDirty = true;
      let oobFlashTimer = 0; // out-of-bounds flash timer

      // Interaction
      let dragTarget = null; // { type:'charge', index } or null
      let mouseField = { x: -1, y: -1 }; // mouse position in field coordinates
      let mouseOnField = false;


      // ═══════════════════════════════════════════
      //  INITIALIZATION
      // ═══════════════════════════════════════════
      function resetPuck() {
        puck = {
          x: FIELD_W * 0.12,
          y: FIELD_H / 2,
          vx: 0,
          vy: 0,
          charge: puckCharge,
          radius: PUCK_R,
        };
        trail = [];
      }

      function initLevel(level) {
        currentLevel = level;
        walls = makeLevelWalls(level);
        resetPuck();
        gameState = "setup";
        particles = [];
        fieldCacheDirty = true;
        updateUI();
        markDirty();
      }

      function resizeCanvas() {
        const wrap = document.getElementById("canvas-wrap");
        const pxW = Math.max(1, Math.round(wrap.clientWidth));
        const pxH = Math.max(1, Math.round(wrap.clientHeight));
        const dpr = window.devicePixelRatio || 1;

        // Mērogs no augstuma: laukums ~560 vienības augsts kā līdz šim; zemā ekrānā ne mazāks par 0,5 (lādiņi paliek pirksta lielumā)
        const totalH = BASE_H + WALL_T * 2 + VISUAL_MARGIN * 2;
        scale = Math.min(1.25, Math.max(0.5, pxH / totalH));
        const newW = Math.max(200, pxW / scale - WALL_T * 2 - GOAL_DEPTH);
        const newH = Math.max(200, pxH / scale - WALL_T * 2 - VISUAL_MARGIN * 2);

        // Lādiņi, ripa un pēdas paliek proporcionāli savās vietās; sienas pārrēķina no līmeņa
        const kx = newW / FIELD_W;
        const ky = newH / FIELD_H;
        if (kx !== 1 || ky !== 1) {
          for (const c of charges) {
            c.x *= kx;
            c.y *= ky;
          }
          if (puck) {
            puck.x *= kx;
            puck.y *= ky;
          }
          for (const t of trail) {
            t.x *= kx;
            t.y *= ky;
          }
          FIELD_W = newW;
          FIELD_H = newH;
          walls = makeLevelWalls(currentLevel);
          fieldCacheDirty = true;
        }

        if (canvas.width !== Math.round(pxW * dpr) || canvas.height !== Math.round(pxH * dpr)) {
          canvas.width = Math.round(pxW * dpr);
          canvas.height = Math.round(pxH * dpr);
        }
        ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * scale * offsetX, dpr * scale * offsetY);
        markDirty();
      }

      // ═══════════════════════════════════════════
      //  GOAL GEOMETRY
      // ═══════════════════════════════════════════
      function goalTop() {
        return (FIELD_H - GOAL_OPENING) / 2;
      }
      function goalBot() {
        return (FIELD_H + GOAL_OPENING) / 2;
      }

      // ═══════════════════════════════════════════
      //  PHYSICS
      // ═══════════════════════════════════════════
      function computeForceOn(px, py, pCharge, excludeIndex) {
        let fx = 0,
          fy = 0;
        for (let i = 0; i < charges.length; i++) {
          if (i === excludeIndex) continue;
          const c = charges[i];
          let dx = px - c.x;
          let dy = py - c.y;
          let distSq = dx * dx + dy * dy;
          let dist = Math.sqrt(distSq);
          if (dist < MIN_DIST) dist = MIN_DIST;
          distSq = dist * dist;

          const forceMag = (COULOMB_K * pCharge * c.charge) / distSq;
          fx += (forceMag * dx) / dist;
          fy += (forceMag * dy) / dist;
        }
        return { fx, fy };
      }

      function stepPhysics() {
        if (gameState !== "running") return;

        const subDt = DT / SUB_STEPS;

        for (let s = 0; s < SUB_STEPS; s++) {
          // Compute net force on puck
          const { fx, fy } = computeForceOn(puck.x, puck.y, puck.charge, -1);

          // Acceleration (F = ma)
          const ax = fx / puckMass;
          const ay = fy / puckMass;

          // Velocity Verlet: half-step velocity
          puck.vx += ax * subDt * 0.5;
          puck.vy += ay * subDt * 0.5;

          // Clamp speed
          const speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
          if (speed > MAX_SPEED) {
            puck.vx = (puck.vx / speed) * MAX_SPEED;
            puck.vy = (puck.vy / speed) * MAX_SPEED;
          }

          // Update position
          puck.x += puck.vx * subDt;
          puck.y += puck.vy * subDt;

          // Second half-step velocity (with new position force)
          const f2 = computeForceOn(puck.x, puck.y, puck.charge, -1);
          puck.vx += (f2.fx / puckMass) * subDt * 0.5;
          puck.vy += (f2.fy / puckMass) * subDt * 0.5;

          // Wall collisions (internal)
          for (const wall of walls) {
            resolveCircleRect(puck, wall);
          }

          // Boundary collisions (true = puck went out of bounds and was reset)
          if (handleBoundary()) return;

          // Goal check
          if (checkGoal()) {
            gameState = "won";
            spawnCelebration();
            updateUI();
            return;
          }
        }

        // Record trail
        if (showTrace) {
          trail.push({ x: puck.x, y: puck.y });
          if (trail.length > 2000) trail.shift();
        }
      }

      function resolveCircleRect(circle, rect) {
        // Find closest point on rectangle to circle center
        const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));

        const dx = circle.x - closestX;
        const dy = circle.y - closestY;
        const distSq = dx * dx + dy * dy;
        const r = circle.radius;

        if (distSq < r * r && distSq > 0.001) {
          const dist = Math.sqrt(distSq);
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = r - dist + 0.5; // extra push to prevent sticking

          // Push out
          circle.x += nx * overlap;
          circle.y += ny * overlap;

          // Reflect velocity along collision normal
          const vDotN = circle.vx * nx + circle.vy * ny;
          if (vDotN < 0) {
            circle.vx -= (1 + BOUNCE_COEFF) * vDotN * nx;
            circle.vy -= (1 + BOUNCE_COEFF) * vDotN * ny;
          }
        } else if (distSq <= 0.001) {
          // Circle center is inside the rectangle - push out to nearest edge
          const dLeft = circle.x - rect.x;
          const dRight = rect.x + rect.w - circle.x;
          const dTop = circle.y - rect.y;
          const dBot = rect.y + rect.h - circle.y;
          const minD = Math.min(dLeft, dRight, dTop, dBot);

          if (minD === dLeft) {
            circle.x = rect.x - r - 1;
            circle.vx = -Math.abs(circle.vx) * BOUNCE_COEFF;
          } else if (minD === dRight) {
            circle.x = rect.x + rect.w + r + 1;
            circle.vx = Math.abs(circle.vx) * BOUNCE_COEFF;
          } else if (minD === dTop) {
            circle.y = rect.y - r - 1;
            circle.vy = -Math.abs(circle.vy) * BOUNCE_COEFF;
          } else {
            circle.y = rect.y + rect.h + r + 1;
            circle.vy = Math.abs(circle.vy) * BOUNCE_COEFF;
          }
        }
      }

      function handleBoundary() {
        const r = puck.radius;
        const gt = goalTop();
        const gb = goalBot();

        // --- Out-of-bounds check: reset if puck exits the LARGE physics field (2x visible) ---
        if (outOfPhysicsField(puck.x, puck.y)) {
          gameState = "setup";
          oobFlashTimer = 90; // ~1.5 seconds of flash
          resetPuck();
          updateUI();
          return true;
        }

        // NO bouncing off visible field borders - puck passes through freely
        // Puck ONLY bounces off: obstacles, goal poles, goal back wall

        // --- Goal area collisions (only when puck is near the goal) ---
        if (puck.x > FIELD_W - r - 10) {
          const inGoalY = puck.y > gt + r + 2 && puck.y < gb - r - 2;

          if (inGoalY) {
            // Back wall of goal (net); post collisions are handled by
            // the resolveCircleRect calls below
            if (puck.x > FIELD_W + GOAL_DEPTH - r) {
              puck.x = FIELD_W + GOAL_DEPTH - r;
              puck.vx = -Math.abs(puck.vx) * BOUNCE_COEFF;
            }
          }
        }

        // Goal post collision boxes (top and bottom posts)
        resolveCircleRect(puck, {
          x: FIELD_W - WALL_T / 2,
          y: gt - WALL_T,
          w: GOAL_DEPTH + WALL_T / 2,
          h: WALL_T,
        });
        resolveCircleRect(puck, {
          x: FIELD_W - WALL_T / 2,
          y: gb,
          w: GOAL_DEPTH + WALL_T / 2,
          h: WALL_T,
        });

        return false;
      }

      function checkGoal() {
        const gt = goalTop();
        const gb = goalBot();
        return (
          puck.x > FIELD_W + GOAL_DEPTH * 0.4 &&
          puck.x < FIELD_W + GOAL_DEPTH &&
          puck.y > gt &&
          puck.y < gb
        );
      }

      // ═══════════════════════════════════════════
      //  FIELD VISUALIZATION
      // ═══════════════════════════════════════════
      function computeFieldGrid() {
        if (!fieldCacheDirty && fieldCache) return fieldCache;

        const spacing = 40;
        const cols = Math.floor(FIELD_W / spacing);
        const rows = Math.floor(FIELD_H / spacing);
        const grid = [];

        for (let r = 0; r <= rows; r++) {
          for (let c = 0; c <= cols; c++) {
            const x = c * spacing + spacing / 2;
            const y = r * spacing + spacing / 2;
            if (x > FIELD_W || y > FIELD_H) continue;

            let ex = 0,
              ey = 0;
            for (const ch of charges) {
              const dx = x - ch.x;
              const dy = y - ch.y;
              let dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < MIN_DIST) dist = MIN_DIST;
              const eMag = (COULOMB_K * ch.charge) / (dist * dist);
              ex += (eMag * dx) / dist;
              ey += (eMag * dy) / dist;
            }

            const mag = Math.sqrt(ex * ex + ey * ey);
            grid.push({ x, y, ex, ey, mag });
          }
        }

        fieldCache = grid;
        fieldCacheDirty = false;
        return grid;
      }

      // ═══════════════════════════════════════════
      //  CELEBRATION PARTICLES
      // ═══════════════════════════════════════════
      function spawnCelebration() {
        const cx = FIELD_W + GOAL_DEPTH / 2;
        const cy = FIELD_H / 2;
        for (let i = 0; i < 120; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 8;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            decay: 0.008 + Math.random() * 0.015,
            hue: Math.random() * 360,
            size: 2 + Math.random() * 6,
          });
        }
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      // ═══════════════════════════════════════════
      //  RENDERING
      // ═══════════════════════════════════════════
      function render() {
        // Clear everything (including outside field)
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = COL.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        drawFieldBackground();
        drawGoal();
        if (showField && charges.length > 0) drawFieldVectors();
        if (showTrace && trail.length > 1) drawTrail();
        drawWalls();
        drawCharges();
        drawPuck();
        if (showForce && charges.length > 0) drawForceArrow();
        drawParticles();
        if (gameState === "won") drawWinOverlay();
        if (mouseOnField && canManipulateCharges() && !dragTarget)
          drawGhostCharge();
        if (oobFlashTimer > 0) drawOobFlash();
      }

      // Pārklājums pa visu kanvu (pašreizējā fillStyle), neatkarīgi no pasaules transformācijas
      function fillWholeCanvas() {
        const m = ctx.getTransform();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(m);
      }

      function drawOobFlash() {
        const alpha = Math.min(oobFlashTimer / 30, 1) * 0.35;
        ctx.save();
        ctx.fillStyle = `rgba(${COL.oob}, ${alpha})`;
        fillWholeCanvas();

        if (oobFlashTimer > 40) {
          ctx.font = `bold 28px ${COL.font}`;
          ctx.fillStyle = `rgba(${COL.oob}, ${Math.min(oobFlashTimer / 40, 1)})`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(
            TRANSLATIONS[currentLang].outOfBounds,
            FIELD_W / 2,
            FIELD_H / 2,
          );
        }
        ctx.restore();
      }

      function drawFieldBackground() {
        // Field area
        ctx.fillStyle = COL.field;
        ctx.fillRect(0, 0, FIELD_W, FIELD_H);

        // Subtle grid
        ctx.strokeStyle = COL.grid;
        ctx.lineWidth = 0.5;
        const spacing = 40;
        for (let x = spacing; x < FIELD_W; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, FIELD_H);
          ctx.stroke();
        }
        for (let y = spacing; y < FIELD_H; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(FIELD_W, y);
          ctx.stroke();
        }

        // Border
        ctx.strokeStyle = COL.wall;
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, FIELD_W, FIELD_H);

        // Starting position indicator (when in setup)
        if (gameState === "setup") {
          ctx.save();
          ctx.globalAlpha = 0.15;
          ctx.beginPath();
          ctx.arc(FIELD_W * 0.12, FIELD_H / 2, 30, 0, Math.PI * 2);
          ctx.fillStyle = COL.puck;
          ctx.fill();
          ctx.restore();
        }
      }

      function drawGoal() {
        const gt = goalTop();
        const gb = goalBot();

        // Goal area fill
        ctx.fillStyle = COL.goalFill;
        ctx.fillRect(FIELD_W, gt, GOAL_DEPTH, GOAL_OPENING);

        // Net pattern
        ctx.strokeStyle = COL.goalNet;
        ctx.lineWidth = 0.5;
        const step = 12;
        for (let x = FIELD_W + step; x < FIELD_W + GOAL_DEPTH; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, gt);
          ctx.lineTo(x, gb);
          ctx.stroke();
        }
        for (let y = gt + step; y < gb; y += step) {
          ctx.beginPath();
          ctx.moveTo(FIELD_W, y);
          ctx.lineTo(FIELD_W + GOAL_DEPTH, y);
          ctx.stroke();
        }

        // Goal frame
        ctx.strokeStyle = COL.goalBorder;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(FIELD_W, gt);
        ctx.lineTo(FIELD_W + GOAL_DEPTH, gt);
        ctx.lineTo(FIELD_W + GOAL_DEPTH, gb);
        ctx.lineTo(FIELD_W, gb);
        ctx.stroke();

        // Goal posts glow
        ctx.save();
        if (COL.glow) {
          ctx.shadowColor = COL.goalBorder;
          ctx.shadowBlur = 12;
        }
        ctx.fillStyle = COL.goalBorder;
        ctx.beginPath();
        ctx.arc(FIELD_W, gt, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(FIELD_W, gb, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Goal label
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.font = `bold 11px ${COL.font}`;
        ctx.fillStyle = COL.goalBorder;
        ctx.textAlign = "center";
        ctx.fillText(
          TRANSLATIONS[currentLang].goalLabel,
          FIELD_W + GOAL_DEPTH / 2,
          FIELD_H / 2 + 4,
        );
        ctx.restore();
      }

      function drawWalls() {
        for (const w of walls) {
          // Glow
          ctx.save();
          if (COL.glow) {
            ctx.shadowColor = COL.wallGlow;
            ctx.shadowBlur = 8;
          }
          ctx.fillStyle = COL.wall;
          ctx.fillRect(w.x, w.y, w.w, w.h);
          ctx.restore();

          // Highlight edge
          ctx.strokeStyle = COL.wallEdge;
          ctx.lineWidth = 1;
          ctx.strokeRect(w.x, w.y, w.w, w.h);
        }
      }

      // ═══════════════════════════════════════════
      //  ENHANCED: Glowing charges
      // ═══════════════════════════════════════════
      function drawCharges() {
        for (let i = 0; i < charges.length; i++) {
          const c = charges[i];
          const isPos = c.charge > 0;
          const color = isPos ? COL.positive : COL.negative;
          const bright = isPos ? COL.posBright : COL.negBright;
          const glow = isPos ? COL.posGlow : COL.negGlow;
          const core = isPos ? COL.posCore : COL.negCore;

          const pulseScale = 1;

          if (!COL.glow) {
            // Rasējums: necaurspīdīgs aplītis lādiņa krāsā (vektori paliek zem tā), zīme iekšā (Ansis 06.10)
            ctx.save();
            ctx.beginPath();
            ctx.arc(c.x, c.y, CHARGE_R, 0, Math.PI * 2);
            ctx.fillStyle = COL.field;
            ctx.fill();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.14;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.lineCap = "round";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(c.x - 7, c.y);
            ctx.lineTo(c.x + 7, c.y);
            ctx.stroke();
            if (isPos) {
              ctx.beginPath();
              ctx.moveTo(c.x, c.y - 7);
              ctx.lineTo(c.x, c.y + 7);
              ctx.stroke();
            }
            ctx.restore();
            continue;
          }

          ctx.save();

          // Outer glow rings
          ctx.shadowColor = color;
          ctx.shadowBlur = 25;

          // Outermost glow ring
          ctx.globalAlpha = 0.2;
          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R * 1.8 * pulseScale, 0, Math.PI * 2);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.stroke();

          // Middle glow ring
          ctx.globalAlpha = 0.3;
          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R * 1.4 * pulseScale, 0, Math.PI * 2);
          ctx.stroke();

          // Main circle with gradient
          ctx.globalAlpha = 1;
          const chargeGradient = ctx.createRadialGradient(
            c.x - CHARGE_R * 0.3, c.y - CHARGE_R * 0.3, 0,
            c.x, c.y, CHARGE_R * 1.2
          );
          chargeGradient.addColorStop(0, core);
          chargeGradient.addColorStop(0.4, glow);
          chargeGradient.addColorStop(1, "rgba(0,0,0,0)");

          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R * 1.1, 0, Math.PI * 2);
          ctx.fillStyle = chargeGradient;
          ctx.fill();

          // Main stroke
          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R, 0, Math.PI * 2);
          ctx.strokeStyle = bright;
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // Inner highlight
          ctx.beginPath();
          ctx.arc(c.x, c.y, CHARGE_R - 3, 0, Math.PI * 2);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.4;
          ctx.stroke();

          ctx.restore();

          // Symbol with glow
          ctx.save();
          ctx.shadowColor = bright;
          ctx.shadowBlur = 8;
          ctx.strokeStyle = bright;
          ctx.lineCap = "round";
          ctx.lineWidth = 3;
          const symLen = 7;

          // Horizontal line
          ctx.beginPath();
          ctx.moveTo(c.x - symLen, c.y);
          ctx.lineTo(c.x + symLen, c.y);
          ctx.stroke();

          // Vertical line (+ only)
          if (isPos) {
            ctx.beginPath();
            ctx.moveTo(c.x, c.y - symLen);
            ctx.lineTo(c.x, c.y + symLen);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawPuck() {
        if (!puck) return;

        // Color based on charge
        const isPositive = puck.charge >= 0;
        const puckColor = isPositive ? COL.puck : COL.puckNeg;
        const puckFill = isPositive ? COL.puckFill : COL.puckFillNeg;

        ctx.save();
        if (COL.glow) {
          ctx.shadowColor = puckColor;
          ctx.shadowBlur = 20;
        }

        // Main circle (rasējumā necaurspīdīgs — vektori zem ripas)
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, PUCK_R, 0, Math.PI * 2);
        if (!COL.glow) {
          ctx.fillStyle = COL.field;
          ctx.fill();
        }
        ctx.fillStyle = puckFill;
        ctx.fill();
        ctx.strokeStyle = puckColor;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // Symbol based on charge (+ or -)
        ctx.strokeStyle = puckColor;
        ctx.lineCap = "round";
        ctx.lineWidth = 2.5;
        const puckSymLen = 6;
        // Horizontal line (both + and -)
        ctx.beginPath();
        ctx.moveTo(puck.x - puckSymLen, puck.y);
        ctx.lineTo(puck.x + puckSymLen, puck.y);
        ctx.stroke();
        // Vertical line (only for positive)
        if (isPositive) {
          ctx.beginPath();
          ctx.moveTo(puck.x, puck.y - puckSymLen);
          ctx.lineTo(puck.x, puck.y + puckSymLen);
          ctx.stroke();
        }
      }

      function drawTrail() {
        if (trail.length < 2) return;
        for (let i = 1; i < trail.length; i++) {
          const alpha = (i / trail.length) * 0.6;
          ctx.strokeStyle = COL.trail + alpha.toFixed(3) + ")";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
          ctx.lineTo(trail[i].x, trail[i].y);
          ctx.stroke();
        }
      }

      // ═══════════════════════════════════════════
      //  ENHANCED: Field vectors with gradient colors
      // ═══════════════════════════════════════════
      function drawFieldVectors() {
        const grid = computeFieldGrid();
        if (!grid.length) return;

        const maxMag = Math.max(...grid.map((g) => g.mag), 1);
        const arrowLen = 42; // 1.5x longer (was 28)

        for (const pt of grid) {
          if (pt.mag < 0.01) continue;

          const strength = Math.min(pt.mag / maxMag, 1);
          const len = arrowLen * Math.pow(strength, 0.35);
          const angle = Math.atan2(pt.ey, pt.ex);

          const endX = pt.x + Math.cos(angle) * len;
          const endY = pt.y + Math.sin(angle) * len;

          // Color gradient based on strength
          const hue = 180 + strength * 20; // Cyan to slightly more blue
          const lightness = 50 + strength * 20;
          const alpha = 0.25 + strength * 0.5;

          ctx.save();

          let headFill;
          if (COL.vector) {
            // Rasējums: tinte, caurspīdīgums pēc stipruma, bez gradienta un spīduma
            const inkA = 0.3 + strength * 0.6;
            ctx.strokeStyle = `rgba(${COL.vector},${inkA.toFixed(3)})`;
            headFill = ctx.strokeStyle;
          } else {
            if (strength > 0.5) {
              ctx.shadowColor = `hsla(${hue}, 100%, ${lightness}%, 0.4)`;
              ctx.shadowBlur = 4;
            }
            const arrowGradient = ctx.createLinearGradient(pt.x, pt.y, endX, endY);
            arrowGradient.addColorStop(0, `hsla(${hue}, 80%, ${lightness}%, ${alpha * 0.3})`);
            arrowGradient.addColorStop(1, `hsla(${hue}, 100%, ${lightness}%, ${alpha})`);
            ctx.strokeStyle = arrowGradient;
            headFill = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
          }
          ctx.lineWidth = 0.8 + strength * 0.8;
          ctx.lineCap = "round";

          // Line
          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();

          // Arrowhead (filled triangle for better visibility)
          const headLen = 4 + strength * 3;
          const headAngle = 0.5;
          ctx.fillStyle = headFill;
          ctx.beginPath();
          ctx.moveTo(endX, endY);
          ctx.lineTo(
            endX - Math.cos(angle - headAngle) * headLen,
            endY - Math.sin(angle - headAngle) * headLen,
          );
          ctx.lineTo(
            endX - Math.cos(angle + headAngle) * headLen,
            endY - Math.sin(angle + headAngle) * headLen,
          );
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }
      }

      function drawForceArrow() {
        if (!puck) return;
        const { fx, fy } = computeForceOn(puck.x, puck.y, puck.charge, -1);
        const mag = Math.sqrt(fx * fx + fy * fy);
        if (mag < 0.1) return;

        // Scale arrow length - 5x longer, max 400px
        const maxArrowLen = 400;
        const arrowLen = Math.min(mag * 0.1, maxArrowLen);
        const angle = Math.atan2(fy, fx);

        // Scale line width with arrow length (2 to 6 pixels)
        const lineWidth = 2 + (arrowLen / maxArrowLen) * 4;

        const endX = puck.x + Math.cos(angle) * arrowLen;
        const endY = puck.y + Math.sin(angle) * arrowLen;

        ctx.save();
        ctx.strokeStyle = COL.forceArrow;
        ctx.fillStyle = COL.forceArrow;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        if (COL.glow) {
          ctx.shadowColor = COL.forceArrow;
          ctx.shadowBlur = 6 + lineWidth;
        }

        // Shaft
        ctx.beginPath();
        ctx.moveTo(puck.x, puck.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // Arrowhead - scales with line width
        const headLen = 8 + lineWidth * 2;
        const headAngle = 0.4;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(
          endX - Math.cos(angle - headAngle) * headLen,
          endY - Math.sin(angle - headAngle) * headLen,
        );
        ctx.lineTo(
          endX - Math.cos(angle + headAngle) * headLen,
          endY - Math.sin(angle + headAngle) * headLen,
        );
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
          if (COL.glow) {
            ctx.shadowColor = `hsl(${p.hue}, 100%, 65%)`;
            ctx.shadowBlur = 6;
          }
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
          ctx.restore();
        }
      }

      function drawWinOverlay() {
        ctx.save();
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = COL.winShade;
        fillWholeCanvas();
        ctx.restore();

        ctx.save();
        if (COL.glow) {
          ctx.shadowColor = COL.goalBorder;
          ctx.shadowBlur = 40;
        }
        ctx.font = `bold 96px ${COL.font}`;
        ctx.fillStyle = COL.goalBorder;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
          TRANSLATIONS[currentLang].goalText,
          FIELD_W / 2,
          FIELD_H / 2 - 30,
        );

        // Play-again hint
        ctx.shadowBlur = COL.glow ? 10 : 0;
        ctx.font = COL.glow ? "600 22px 'Exo 2', sans-serif" : `500 22px ${COL.font}`;
        ctx.fillStyle = COL.winHint;
        ctx.fillText(
          TRANSLATIONS[currentLang].playAgain,
          FIELD_W / 2,
          FIELD_H / 2 + 50,
        );

        ctx.restore();
      }

      function drawGhostCharge() {
        if (mouseField.x < -CHARGE_MARGIN || mouseField.y < -CHARGE_MARGIN) return;
        if (mouseField.x > FIELD_W + CHARGE_MARGIN || mouseField.y > FIELD_H + CHARGE_MARGIN) return;

        const isPos = selectedCharge > 0;
        const color = isPos ? COL.positive : COL.negative;

        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(mouseField.x, mouseField.y, CHARGE_R, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Symbol (drawn with lines)
        ctx.strokeStyle = color;
        ctx.lineCap = "round";
        ctx.lineWidth = 3;
        const ghostSymLen = 8;
        ctx.beginPath();
        ctx.moveTo(mouseField.x - ghostSymLen, mouseField.y);
        ctx.lineTo(mouseField.x + ghostSymLen, mouseField.y);
        ctx.stroke();
        if (isPos) {
          ctx.beginPath();
          ctx.moveTo(mouseField.x, mouseField.y - ghostSymLen);
          ctx.lineTo(mouseField.x, mouseField.y + ghostSymLen);
          ctx.stroke();
        }
        ctx.restore();
      }

      // ═══════════════════════════════════════════
      //  INPUT HANDLING
      // ═══════════════════════════════════════════
      function canvasToField(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = (clientX - rect.left) / scale - offsetX;
        const y = (clientY - rect.top) / scale - offsetY;
        return { x, y };
      }

      function findChargeAt(fx, fy) {
        for (let i = charges.length - 1; i >= 0; i--) {
          const c = charges[i];
          const dx = fx - c.x;
          const dy = fy - c.y;
          if (dx * dx + dy * dy < (CHARGE_R + 8) * (CHARGE_R + 8)) return i;
        }
        return -1;
      }

      function isInsideWall(x, y) {
        for (const w of walls) {
          if (
            x > w.x - CHARGE_R &&
            x < w.x + w.w + CHARGE_R &&
            y > w.y - CHARGE_R &&
            y < w.y + w.h + CHARGE_R
          )
            return true;
        }
        return false;
      }

      function isNearPuck(x, y) {
        if (!puck) return false;
        const dx = x - puck.x;
        const dy = y - puck.y;
        return (
          dx * dx + dy * dy < (PUCK_R + CHARGE_R + 5) * (PUCK_R + CHARGE_R + 5)
        );
      }

      // Check if charge manipulation is allowed (blocked in hard mode while running)
      function canManipulateCharges() {
        return !hardMode || gameState === "setup" || gameState === "won";
      }

      // Mouse events
      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const { x, y } = canvasToField(e.clientX, e.clientY);

        if (e.button === 2) {
          // Right-click: remove charge
          if (!canManipulateCharges()) return;
          const idx = findChargeAt(x, y);
          if (idx >= 0) {
            charges.splice(idx, 1);
            fieldCacheDirty = true;
            updateChargeCount();
            // Keep an active drag consistent with the modified array
            if (dragTarget) {
              if (dragTarget.index === idx) dragTarget = null;
              else if (dragTarget.index > idx) dragTarget.index--;
            }
          }
          return;
        }

        // Left-click: drag or place
        if (!canManipulateCharges()) return;
        const idx = findChargeAt(x, y);
        if (idx >= 0) {
          dragTarget = {
            type: "charge",
            index: idx,
            ox: charges[idx].x - x,
            oy: charges[idx].y - y,
          };
        } else if (x > -CHARGE_MARGIN && x < FIELD_W + CHARGE_MARGIN &&
                   y > -CHARGE_MARGIN && y < FIELD_H + CHARGE_MARGIN) {
          // Place new charge if not on a wall or puck (extended area around field)
          if (!isInsideWall(x, y) && !isNearPuck(x, y)) {
            charges.push({ x: Math.max(CHARGE_MIN_X, x), y, charge: selectedCharge });
            fieldCacheDirty = true;
            updateChargeCount();
            // Start dragging the new charge immediately
            dragTarget = {
              type: "charge",
              index: charges.length - 1,
              ox: 0,
              oy: 0,
            };
          }
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        const { x, y } = canvasToField(e.clientX, e.clientY);
        mouseField.x = x;
        mouseField.y = y;
        // Extended area for charge placement
        mouseOnField = x >= -CHARGE_MARGIN && x <= FIELD_W + CHARGE_MARGIN &&
                       y >= -CHARGE_MARGIN && y <= FIELD_H + CHARGE_MARGIN;

        if (dragTarget) {
          if (!canManipulateCharges()) {
            dragTarget = null;
            return;
          }
          const c = charges[dragTarget.index];
          if (c) {
            c.x = x + dragTarget.ox;
            c.y = y + dragTarget.oy;
            // Clamp to extended charge placement area (left: keep disc visible)
            c.x = Math.max(CHARGE_MIN_X, Math.min(FIELD_W + CHARGE_MARGIN - CHARGE_R, c.x));
            c.y = Math.max(-CHARGE_MARGIN + CHARGE_R, Math.min(FIELD_H + CHARGE_MARGIN - CHARGE_R, c.y));
            fieldCacheDirty = true;
          }
        }
      });

      canvas.addEventListener("mouseup", () => {
        dragTarget = null;
      });

      canvas.addEventListener("mouseleave", () => {
        mouseOnField = false;
        dragTarget = null;
      });

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      // Touch events (place / drag / long-press delete)
      let longPressTimer = null;
      let touchStartClient = null; // touchstart position for long-press move threshold

      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          if (!canManipulateCharges()) return;
          const touch = e.touches[0];
          const { x, y } = canvasToField(touch.clientX, touch.clientY);

          const idx = findChargeAt(x, y);
          if (idx >= 0) {
            // Existing charge: start drag AND arm long-press delete
            dragTarget = {
              type: "charge",
              index: idx,
              ox: charges[idx].x - x,
              oy: charges[idx].y - y,
            };
            touchStartClient = { x: touch.clientX, y: touch.clientY };
            longPressTimer = setTimeout(() => {
              longPressTimer = null;
              if (!canManipulateCharges()) return;
              charges.splice(idx, 1);
              fieldCacheDirty = true;
              updateChargeCount();
              dragTarget = null;
              markDirty();
            }, 500);
          } else if (x > -CHARGE_MARGIN && x < FIELD_W + CHARGE_MARGIN &&
                     y > -CHARGE_MARGIN && y < FIELD_H + CHARGE_MARGIN) {
            // Empty field: place a new charge, do NOT arm the delete timer
            if (!isInsideWall(x, y) && !isNearPuck(x, y)) {
              charges.push({ x: Math.max(CHARGE_MIN_X, x), y, charge: selectedCharge });
              fieldCacheDirty = true;
              updateChargeCount();
              dragTarget = {
                type: "charge",
                index: charges.length - 1,
                ox: 0,
                oy: 0,
              };
            }
          }
        },
        { passive: false },
      );

      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const { x, y } = canvasToField(touch.clientX, touch.clientY);
          mouseField.x = x;
          mouseField.y = y;
          mouseOnField = true;

          // Cancel long-press delete once the finger moves beyond a small threshold
          if (longPressTimer !== null && touchStartClient) {
            const mdx = touch.clientX - touchStartClient.x;
            const mdy = touch.clientY - touchStartClient.y;
            if (mdx * mdx + mdy * mdy > 64) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }
          }

          if (dragTarget) {
            if (!canManipulateCharges()) {
              dragTarget = null;
              return;
            }
            const c = charges[dragTarget.index];
            if (c) {
              c.x = x + dragTarget.ox;
              c.y = y + dragTarget.oy;
              // Clamp to extended charge placement area (left: keep disc visible)
              c.x = Math.max(CHARGE_MIN_X, Math.min(FIELD_W + CHARGE_MARGIN - CHARGE_R, c.x));
              c.y = Math.max(-CHARGE_MARGIN + CHARGE_R, Math.min(FIELD_H + CHARGE_MARGIN - CHARGE_R, c.y));
              fieldCacheDirty = true;
            }
          }
        },
        { passive: false },
      );

      canvas.addEventListener("touchend", () => {
        dragTarget = null;
        mouseOnField = false;
        clearTimeout(longPressTimer);
        longPressTimer = null;
      });

      canvas.addEventListener("touchcancel", () => {
        dragTarget = null;
        mouseOnField = false;
        clearTimeout(longPressTimer);
        longPressTimer = null;
      });

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target && e.target.tagName === "INPUT") return; // slīdnim bultiņas un atstarpe paliek pašam
        if (e.code === "Space") {
          e.preventDefault(); // arī pogai fokusā: citādi atstarpe sāktu un uzreiz apturētu
          if (!e.repeat) toggleStartPause();
        } else if (e.code === "KeyR") {
          doReset();
        } else if (e.code === "KeyC") {
          doClear();
        } else if (e.code === "KeyF") {
          setShown("field", !showField);
        } else if (e.code === "KeyT") {
          setShown("trace", !showTrace);
        }
      });

      // ═══════════════════════════════════════════
      //  UI CONTROLS — viens pogu komplekts visām ierīcēm
      // ═══════════════════════════════════════════
      function updateUI() {
        const badge = document.getElementById("statusBadge");
        const btn = document.getElementById("btnStart");
        const t = TRANSLATIONS[currentLang];
        switch (gameState) {
          case "setup":
            badge.textContent = t.setup;
            badge.className = "status";
            btn.textContent = t.start;
            break;
          case "running":
            badge.textContent = t.running;
            badge.className = "status running";
            btn.textContent = t.pause;
            break;
          case "paused":
            badge.textContent = t.paused;
            badge.className = "status";
            btn.textContent = t.resume;
            break;
          case "won":
            badge.textContent = t.goalStatus;
            badge.className = "status won";
            btn.textContent = t.start;
            break;
        }
        markDirty();
      }

      function updateChargeCount() {
        document.getElementById("chargeCount").textContent = charges.length;
        markDirty();
      }

      function toggleStartPause() {
        if (gameState === "setup" || gameState === "won") {
          if (gameState === "won") {
            resetPuck();
            particles = [];
          }
          gameState = "running";
        } else if (gameState === "running") {
          gameState = "paused";
        } else if (gameState === "paused") {
          gameState = "running";
        }
        updateUI();
      }

      function doReset() {
        resetPuck();
        gameState = "setup";
        particles = [];
        updateUI();
      }

      function doClear() {
        charges = [];
        fieldCacheDirty = true;
        updateChargeCount();
        doReset();
      }

      // Pogu grupas ar vienu izvēlēto (aria-pressed)
      function pressOne(groupId, attr, value) {
        document.querySelectorAll(`#${groupId} button[data-${attr}]`).forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset[attr] === String(value)));
        });
      }

      document.getElementById("levelBtns").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-level]");
        if (btn) selectLevel(btn.dataset.level);
      });
      function selectLevel(level) {
        pressOne("levelBtns", "level", level);
        charges = [];
        updateChargeCount();
        initLevel(level);
      }

      document.getElementById("modeBtns").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-mode]");
        if (btn) selectMode(btn.dataset.mode);
      });
      function selectMode(mode) {
        hardMode = mode === "hard";
        pressOne("modeBtns", "mode", mode);
        markDirty();
      }

      document.getElementById("chargeBtns").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-charge]");
        if (btn) selectChargeType(parseFloat(btn.dataset.charge));
      });
      function selectChargeType(val) {
        selectedCharge = val;
        document.querySelectorAll("#chargeBtns button[data-charge]").forEach((b) => {
          const mine = (parseFloat(b.dataset.charge) > 0) === (val > 0);
          b.classList.toggle("active-pos", mine && val > 0);
          b.classList.toggle("active-neg", mine && val < 0);
        });
        markDirty();
      }

      document.getElementById("btnStart").addEventListener("click", toggleStartPause);
      document.getElementById("btnReset").addEventListener("click", doReset);
      document.getElementById("btnClear").addEventListener("click", doClear);
      document.getElementById("skinSwitch").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-skin]");
        if (!b || b.dataset.skin === skin) return;
        skin = b.dataset.skin;
        save(SKIN_KEY, skin);
        applySkin();
      });
      document.getElementById("skinBtn").addEventListener("click", () => {
        skin = isDraw() ? "neon" : "draw";
        save(SKIN_KEY, skin);
        applySkin();
      });
      document.getElementById("themeBtn").addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        save(THEME_KEY, theme);
        applySkin();
      });
      // pēc klikšķa poga nepatur fokusu — atstarpe paliek spēlei, ne pogai
      document.getElementById("toolbar").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) b.blur();
      });

      document.getElementById("massSlider").addEventListener("input", (e) => {
        puckMass = parseInt(e.target.value, 10);
        document.getElementById("massVal").textContent = puckMass;
        markDirty();
      });
      document.getElementById("chargeSlider").addEventListener("input", (e) => {
        puckCharge = parseInt(e.target.value, 10);
        if (puck) puck.charge = puckCharge;
        document.getElementById("chargeVal").textContent = puckCharge > 0 ? "+" + puckCharge : String(puckCharge);
        markDirty();
      });

      // RĀDĪT — ieslēdzamas pogas; viena funkcija arī tastatūrai (F, T)
      const SHOW = {
        field: { get: () => showField, set: (v) => { showField = v; fieldCacheDirty = true; } },
        trace: { get: () => showTrace, set: (v) => { showTrace = v; if (!v) trail = []; } },
        force: { get: () => showForce, set: (v) => { showForce = v; } },
      };
      function setShown(key, on) {
        SHOW[key].set(on);
        const btn = document.querySelector(`#displayBtns button[data-show="${key}"]`);
        if (btn) btn.setAttribute("aria-pressed", String(on));
        markDirty();
      }
      document.getElementById("displayBtns").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-show]");
        if (btn) setShown(btn.dataset.show, !SHOW[btn.dataset.show].get());
      });
      Object.keys(SHOW).forEach((key) => setShown(key, SHOW[key].get()));

      // Pele un pirksts uz laukuma: pēc katra notikuma pārzīmē (spoku lādiņš seko kursoram, vilkšana kustina)
      ["mousedown", "mousemove", "mouseup", "mouseleave", "touchstart", "touchmove", "touchend", "touchcancel"].forEach((type) =>
        canvas.addEventListener(type, markDirty)
      );

      // ═══════════════════════════════════════════
      //  GAME LOOP
      // ═══════════════════════════════════════════
      // Fixed-timestep accumulator: the simulation advances DT per physics
      // step regardless of the display refresh rate (60/120/144 Hz)
      let lastFrameTime = null;
      let physicsAccumulator = 0;

      function gameLoop(timestamp) {
        if (lastFrameTime !== null) {
          let elapsed = (timestamp - lastFrameTime) / 1000;
          if (elapsed > 0.1) elapsed = 0.1; // tab-switch protection
          physicsAccumulator += elapsed;
        }
        lastFrameTime = timestamp;

        while (physicsAccumulator >= DT) {
          stepPhysics();
          if (oobFlashTimer > 0) oobFlashTimer--;
          physicsAccumulator -= DT;
        }

        updateParticles();
        const animating = gameState === "running" || particles.length > 0 || oobFlashTimer > 0;
        if (animating || dirty) {
          dirty = false;
          render();
        }
        requestAnimationFrame(gameLoop);
      }

      // ═══════════════════════════════════════════
      //  START
      // ═══════════════════════════════════════════
      // Laukuma izmēru nosaka tā laukums (arī kad josla pārlūst citā rindu skaitā), ne tikai logs
      new ResizeObserver(resizeCanvas).observe(document.getElementById("canvas-wrap"));
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      initLanguage();
      initLevel("practice");
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
