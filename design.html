<!DOCTYPE html>
<html lang="lv" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIZ-SIM — rasējuma dizaina prototips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  /* ── Marķieri ─────────────────────────────────────────── */
  :root[data-theme="dark"] {
    --sheet: #15171b;
    --ink: #e8e6e1;
    --ink-dim: #9a9891;
    --hairline: #3a3d42;
    --accent: #ff7a29;
    --field: #0c0e11;
    --charge-pos: #ff5c5c;
    --charge-neg: #5c8cff;
  }
  :root[data-theme="light"] {
    --sheet: #f2efe9;
    --ink: #26261f;
    --ink-dim: #7a776d;
    --hairline: #c9c4b8;
    --accent: #c75612;
    --field: #faf8f3;
    --charge-pos: #b3261e;
    --charge-neg: #1e4bb3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--sheet);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    height: 100dvh;
    overflow: hidden;
    padding: 10px;
  }

  button, input { font-family: inherit; color: inherit; }

  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  /* ── Lapas rāmis ar mēroga atzīmēm ────────────────────── */
  .frame {
    position: relative;
    height: 100%;
    border: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
  }
  /* mēroga atzīmes: īsas iedaļas gar augšējo un kreiso malu */
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  .frame::before {
    top: -1px; left: 0; right: 0; height: 5px;
    background: repeating-linear-gradient(90deg,
      var(--hairline) 0 1px, transparent 1px 64px);
  }
  .frame::after {
    top: 0; bottom: 0; left: -1px; width: 5px;
    background: repeating-linear-gradient(180deg,
      var(--hairline) 0 1px, transparent 1px 64px);
  }

  /* ── Galvene ──────────────────────────────────────────── */
  header {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--hairline);
    flex: none;
  }
  .back {
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-right: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    font-size: 11px;
  }
  .back:hover { background: var(--ink); color: var(--sheet); }
  h1 {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  h1 .sheet-no { color: var(--ink-dim); font-weight: 400; margin-left: auto; padding-left: 16px; }

  /* ── Pamatrežģis ──────────────────────────────────────── */
  .work {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .drawing {
    flex: 1;
    position: relative;
    min-width: 0;
    background: var(--field);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── Vadības aile ─────────────────────────────────────── */
  .controls {
    width: 300px;
    flex: none;
    border-left: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .block { border-bottom: 1px solid var(--hairline); padding: 12px 14px; }
  .block-title {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  /* Mērījumu rindas — tabulārie cipari */
  .readout { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  .readout .k { color: var(--ink-dim); letter-spacing: 0.08em; }
  .readout .v { font-weight: 500; font-variant-numeric: tabular-nums; }
  .readout .v .unit { color: var(--ink-dim); font-weight: 400; }

  /* Slīdnis kā izmēru līnija */
  .dim-row { padding: 8px 0; }
  .dim-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .dim-head label { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); }
  .dim-head output { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .dim-line { position: relative; display: flex; align-items: center; height: 20px; }
  /* bultiņu gali */
  .dim-line::before, .dim-line::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 7px; height: 7px;
    border-top: 1px solid var(--ink-dim);
    pointer-events: none;
  }
  .dim-line::before { left: 0;  border-left: 1px solid var(--ink-dim);  transform: translateY(-50%) rotate(-45deg); }
  .dim-line::after  { right: 0; border-right: 1px solid var(--ink-dim); transform: translateY(-50%) rotate(45deg); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 20px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--ink-dim); }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--ink-dim); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    margin-top: -5px;
    background: var(--sheet);
    border: 1px solid var(--ink);
    transform: rotate(45deg);
  }
  input[type="range"]::-moz-range-thumb {
    width: 9px; height: 9px;
    border-radius: 0;
    background: var(--sheet);
    border: 1px solid var(--ink);
    transform: rotate(45deg);
  }
  input[type="range"]:active::-webkit-slider-thumb,
  input[type="range"]:focus-visible::-webkit-slider-thumb { background: var(--accent); border-color: var(--accent); }
  input[type="range"]:active::-moz-range-thumb,
  input[type="range"]:focus-visible::-moz-range-thumb { background: var(--accent); border-color: var(--accent); }

  /* Pogas — tintes inversija */
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    flex: 1;
    background: none;
    border: 1px solid var(--hairline);
    padding: 7px 10px;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .btn.active { border-color: var(--accent); color: var(--accent); }
  .btn.primary { border-color: var(--ink); font-weight: 600; }

  /* ── Rakstlaukums ─────────────────────────────────────── */
  .titleblock {
    margin-top: auto;
    border-top: 1px solid var(--hairline);
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: none;
  }
  .cell {
    border-bottom: 1px solid var(--hairline);
    padding: 6px 10px;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cell:nth-child(odd) { border-right: 1px solid var(--hairline); }
  .cell .k { font-size: 9px; letter-spacing: 0.12em; color: var(--ink-dim); }
  .cell .v { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; }
  .cell button {
    background: none;
    border: none;
    padding: 0 4px 0 0;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink-dim);
  }
  .cell button.active { color: var(--accent); }
  .cell button:hover { color: var(--ink); }

  /* ── Telefona portrets: kanva augšā, vadība apakšā ────── */
  @media (max-width: 700px) and (orientation: portrait) {
    body { padding: 6px; font-size: 12px; }
    .work { flex-direction: column; }
    .drawing { flex: 1.2; }
    .controls {
      width: auto;
      flex: 1;
      border-left: none;
      border-top: 1px solid var(--hairline);
    }
    .titleblock {
      grid-template-columns: repeat(4, 1fr);
      position: sticky;
      bottom: 0;
      background: var(--sheet);
    }
    .cell { min-height: 34px; padding: 4px 8px; }
    .cell:nth-child(odd) { border-right: none; }
    .cell:not(:last-child) { border-right: 1px solid var(--hairline); }
    .cell .k { font-size: 8px; }
    h1 { font-size: 12px; padding: 8px 10px; }
  }

  /* ── Telefona ainava: šaura vadības aile ──────────────── */
  @media (max-height: 480px) and (orientation: landscape) {
    body { padding: 6px; }
    .controls { width: 240px; }
    .block { padding: 8px 12px; }
    h1 { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <a class="back" href="index.html">← SARAKSTS</a>
    <h1>ELEKTRISKAIS LAUKS <span class="sheet-no">E-02</span></h1>
  </header>

  <div class="work">
    <div class="drawing"><canvas id="fieldCanvas" aria-label="Lauka zīmējums: divi lādiņi ar lauka līnijām"></canvas></div>

    <aside class="controls">
      <section class="block">
        <div class="block-title">MĒRĪJUMI</div>
        <div class="readout"><span class="k">E LAUKS</span><span class="v" id="roE">4 218 <span class="unit">N/C</span></span></div>
        <div class="readout"><span class="k">POTENCIĀLS</span><span class="v" id="roV">−1 072 <span class="unit">V</span></span></div>
        <div class="readout"><span class="k">SPĒKS</span><span class="v" id="roF">2,63 <span class="unit">mN</span></span></div>
      </section>

      <section class="block">
        <div class="block-title">PARAMETRI</div>
        <div class="dim-row">
          <div class="dim-head"><label for="sQ">LĀDIŅŠ q</label><output id="oQ" for="sQ">+3 e</output></div>
          <div class="dim-line"><input type="range" id="sQ" min="-5" max="5" step="1" value="3"></div>
        </div>
        <div class="dim-row">
          <div class="dim-head"><label for="sD">ATTĀLUMS d</label><output id="oD" for="sD">120 mm</output></div>
          <div class="dim-line"><input type="range" id="sD" min="40" max="260" step="10" value="120"></div>
        </div>
      </section>

      <section class="block">
        <div class="block-title">REŽĪMS</div>
        <div class="btn-row" role="group" aria-label="Režīma izvēle">
          <button class="btn active">VEKTORI</button>
          <button class="btn">LĪNIJAS</button>
          <button class="btn">EKVIPOT.</button>
        </div>
      </section>

      <section class="block">
        <div class="btn-row">
          <button class="btn primary">▶ SĀKT</button>
          <button class="btn">↺ ATIESTATĪT</button>
        </div>
      </section>

      <div class="titleblock">
        <div class="cell"><span class="k">KOMPLEKTS</span><span class="v">FIZ-SIM</span></div>
        <div class="cell"><span class="k">LAPA</span><span class="v">E-02 / 04</span></div>
        <div class="cell"><span class="k">TĒMA</span><span class="v">ELEKTRĪBA</span></div>
        <div class="cell">
          <span class="k">VALODA / TĒMA</span>
          <span class="v">
            <button class="active" aria-pressed="true">LV</button><button aria-pressed="false">EN</button>
            <button id="themeToggle" aria-label="Pārslēgt gaišo un tumšo režīmu" style="float: right;">◐</button>
          </span>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
  // ── Tēma: seko sistēmai, pārslēgs saglabājas ─────────────
  const THEME_KEY = 'fiz-sim-theme';
  const root = document.documentElement;
  const media = window.matchMedia('(prefers-color-scheme: light)');

  function applyTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    root.dataset.theme = saved || (media.matches ? 'light' : 'dark');
    drawScene();
  }
  media.addEventListener('change', () => { if (!localStorage.getItem(THEME_KEY)) applyTheme(); });
  document.getElementById('themeToggle').addEventListener('click', () => {
    localStorage.setItem(THEME_KEY, root.dataset.theme === 'dark' ? 'light' : 'dark');
    applyTheme();
  });

  // ── Demonstrācijas zīmējums no tēmas krāsām ─────────────
  const canvas = document.getElementById('fieldCanvas');
  const ctx = canvas.getContext('2d');

  function themeColors() {
    const s = getComputedStyle(root);
    return {
      field: s.getPropertyValue('--field').trim(),
      ink: s.getPropertyValue('--ink').trim(),
      inkDim: s.getPropertyValue('--ink-dim').trim(),
      hairline: s.getPropertyValue('--hairline').trim(),
      pos: s.getPropertyValue('--charge-pos').trim(),
      neg: s.getPropertyValue('--charge-neg').trim()
    };
  }

  function drawScene() {
    const wrap = canvas.parentElement;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (w <= 0 || h <= 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = themeColors();

    ctx.fillStyle = c.field;
    ctx.fillRect(0, 0, w, h);

    // milimetru režģis
    ctx.strokeStyle = c.hairline;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0.5; x < w; x += 24) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = 0.5; y < h; y += 24) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // dipola lauka līnijas (RK2 trase, statiska)
    const q1 = { x: w * 0.36, y: h * 0.5, q: +1 };
    const q2 = { x: w * 0.64, y: h * 0.5, q: -1 };
    const field = (x, y) => {
      let ex = 0, ey = 0;
      for (const c0 of [q1, q2]) {
        const dx = x - c0.x, dy = y - c0.y;
        const d2 = Math.max(dx * dx + dy * dy, 25);
        const inv = c0.q / (d2 * Math.sqrt(d2));
        ex += dx * inv; ey += dy * inv;
      }
      return { ex, ey };
    };
    ctx.strokeStyle = c.inkDim;
    ctx.lineWidth = 1;
    const R = 14;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * 2 * Math.PI;
      let x = q1.x + R * Math.cos(a), y = q1.y + R * Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let s = 0; s < 600; s++) {
        const f1 = field(x, y);
        let m1 = Math.hypot(f1.ex, f1.ey); if (!m1) break;
        const mx = x + (f1.ex / m1) * 3, my = y + (f1.ey / m1) * 3;
        const f2 = field(mx, my);
        const m2 = Math.hypot(f2.ex, f2.ey); if (!m2) break;
        x += (f2.ex / m2) * 6; y += (f2.ey / m2) * 6;
        ctx.lineTo(x, y);
        if (Math.hypot(x - q2.x, y - q2.y) < R) break;
        if (x < -20 || x > w + 20 || y < -20 || y > h + 20) break;
      }
      ctx.stroke();
    }

    // lādiņi — plakani diski ar tintes kontūru, bez spīduma
    for (const c0 of [q1, q2]) {
      ctx.beginPath();
      ctx.arc(c0.x, c0.y, R, 0, 2 * Math.PI);
      ctx.fillStyle = c0.q > 0 ? c.pos : c.neg;
      ctx.fill();
      ctx.strokeStyle = c.ink;
      ctx.stroke();
      ctx.strokeStyle = c.field;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(c0.x - 6, c0.y); ctx.lineTo(c0.x + 6, c0.y);
      if (c0.q > 0) { ctx.moveTo(c0.x, c0.y - 6); ctx.lineTo(c0.x, c0.y + 6); }
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  }

  window.addEventListener('resize', drawScene);

  // ── Slīdņu demonstrācija: tabulārie cipari nelēkā ───────
  const sQ = document.getElementById('sQ'), oQ = document.getElementById('oQ');
  const sD = document.getElementById('sD'), oD = document.getElementById('oD');
  function fmtQ(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v) + ' e'; }
  sQ.addEventListener('input', () => {
    oQ.textContent = fmtQ(+sQ.value);
    document.getElementById('roF').innerHTML = (Math.abs(+sQ.value) * 0.876).toFixed(2).replace('.', ',') + ' <span class="unit">mN</span>';
  });
  sD.addEventListener('input', () => {
    oD.textContent = sD.value + ' mm';
    document.getElementById('roE').innerHTML = Math.round(4218 * 120 / +sD.value).toLocaleString('lv') + ' <span class="unit">N/C</span>';
  });

  applyTheme();
</script>
</body>
</html>
