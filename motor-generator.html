<!DOCTYPE html>
<html lang="lv" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ģenerators un motors — FIZ-SIM</title>
<script>
  // Tēma pirms pirmā zīmējuma, lai nemirgo; tā pati loģika kā sim-core.js createTheme().
  try {
    var saved = localStorage.getItem('fiz-sim-theme');
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sim-common.css">
<script type="module" src="assets/emotor/main.js"></script>
</head>
<body class="layout-hud e01">
<a class="e01-skip" href="#main" data-i18n="page.skip">Pāriet uz saturu</a>
<div class="frame">
  <header>
    <a class="back" href="index.html"><span aria-hidden="true">← </span><span class="e01-backword" data-i18n="page.backWord">SARAKSTS</span></a>
    <h1 class="e01-h1"><span data-i18n="page.heading">ĢENERATORS UN MOTORS</span> <span class="sheet-no">E-01</span></h1>
    <div class="head-tools" id="headTools"></div>
  </header>
  <main class="e01-main" id="main" tabindex="-1">
    <div class="m01-bar e01-bar" id="bar">
      <div class="m01-group" role="group" aria-labelledby="modeLabel">
        <span class="m01-label" id="modeLabel">REŽĪMS</span>
        <div class="m01-row e01-seg">
          <button class="btn" id="modeMotor" type="button" aria-pressed="true">MOTORS</button>
          <button class="btn" id="modeGen" type="button" aria-pressed="false">ĢENERATORS</button>
        </div>
      </div>
      <div class="m01-group">
        <span class="m01-label" id="valLabel">SPRIEGUMS U</span>
        <div class="m01-row">
          <button class="q-step" id="valMinus" type="button">−</button>
          <input class="dim-range" id="valRange" type="range">
          <button class="q-step" id="valPlus" type="button">+</button>
          <span class="m01-val e01-val"><span id="valText">3,0 V</span> <span class="e01-freq" id="freqText"></span></span>
        </div>
      </div>
      <div class="m01-group" role="group" aria-labelledby="circuitLabel">
        <span class="m01-label" id="circuitLabel">SLĒDŽI</span>
        <div class="m01-row">
          <button class="btn e01-flip" id="flipBtn" type="button"><span aria-hidden="true">⇄ </span><span class="e01-word" id="flipW">POLARITĀTE</span><span class="e01-short" id="flipS"> +/−</span></button>
          <button class="btn e01-tog" id="commBtn" type="button" aria-pressed="false">KOLEKTORS</button>
          <button class="btn e01-tog" id="freeBtn" type="button" aria-pressed="false">ATĻAUT KUSTĪBU</button>
        </div>
      </div>
      <div class="m01-group" role="group" aria-labelledby="showLabel">
        <span class="m01-label" id="showLabel">RĀDĪT</span>
        <div class="m01-row e01-show">
          <button class="btn e01-tog" id="showI" type="button" aria-pressed="true"><span class="e01-word" id="showIW">STRĀVA</span> I</button>
          <button class="btn e01-tog" id="showB" type="button" aria-pressed="true"><span class="e01-word" id="showBW">LAUKS</span> B</button>
          <button class="btn e01-tog" id="showF" type="button" aria-pressed="true"><span class="e01-word" id="showFW">SPĒKI</span> F</button>
          <button class="btn e01-tog" id="showPhi" type="button" aria-pressed="false" hidden><span class="e01-word" id="showPhiW">PLŪSMA</span> Φ</button>
        </div>
      </div>
      <div class="m01-group m01-end">
        <span class="m01-label" id="timeLabel">LAIKS</span>
        <div class="m01-row">
          <button class="btn pause" id="pauseBtn" type="button">⏸︎</button>
          <button class="btn" id="resetBtn" type="button">↺ NO SĀKUMA</button>
          <button class="btn e01-info" id="infoBtn" type="button">i</button>
        </div>
      </div>
    </div>
    <div class="work e01-work" id="work">
      <div class="drawing" id="drawing">
        <p class="boot-msg" id="bootMsg">Lapa neielādējās. Atver to caur tīmekļa serveri (piem. ans-sta.github.io/fiz-sim), nevis kā failu no datora. · The page did not load. Open it through a web server, not as a local file.</p>
        <canvas id="scene" role="img" aria-label="Ģenerators un motors" aria-describedby="sceneDesc"></canvas>
        <div class="notices" id="notices" role="status" aria-live="polite"></div>
      </div>
      <div class="e01-graph" id="graphBox" hidden>
        <canvas id="graph" role="img" aria-label="Sprieguma grafiks"></canvas>
      </div>
      <div class="title-small" id="titleSmall" hidden></div>
      <div id="gear"></div>
    </div>
    <p class="e01-sr" id="sceneDesc"></p>
    <p class="e01-sr" id="live" role="status" aria-live="polite"></p>
  </main>
</div>
</body>
</html>
